# Copy this directory when creating a new workspace member.
# Rename the package and adjust paths — see README.md in this directory.

[project]
name = "template_package"
version = "0.1.0"
description = "Template for new workspace members"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_package"]
