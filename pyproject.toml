[project]
name = "mono"
version = "0.1.0"
description = "Personal Python monorepo: apps + shared packages managed by uv workspace"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 120
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# RUF001/2/3: 中文文案的全角标点（，：（）等）是正常用法，非误用 ASCII 近似字符
# UP031: 存量代码统一使用 % 格式化（作者风格），强制 f-string 会造成大规模无意义 diff
ignore = ["RUF001", "RUF002", "RUF003", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
asyncio_mode = "auto"
