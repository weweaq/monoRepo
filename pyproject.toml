[project]
name = "mono"
version = "0.1.0"
description = "Personal Python monorepo: apps + shared packages managed by uv workspace"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    # 与 .pre-commit-config.yaml 的 ruff hook (v0.12.5) 对齐；ruff 0.16 起默认
    # 规则集扩大，升级前须评估全仓影响
    "ruff>=0.12,<0.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 120
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# RUF001/2/3: 中文文案的全角标点（，：（）等）是正常用法，非误用 ASCII 近似字符
# UP031: 存量代码统一使用 % 格式化（作者风格），强制 f-string 会造成大规模无意义 diff
ignore = ["RUF001", "RUF002", "RUF003", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
asyncio_mode = "auto"
# 独立 basetemp：绕开共享 %TEMP%\pytest-of-* 目录（其中遗留的 ACL 拒绝符号链接
# 会让 pytest 启动即崩溃，WinError 5）。每次运行自动清空该目录。
addopts = "--basetemp=tmp_pytest"
