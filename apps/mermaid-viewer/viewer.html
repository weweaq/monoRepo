<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mermaid Viewer - 本地 mmd 查看器</title>
<style>
  :root {
    --paper: #fbfbfa;
    --ink: #1f2733;
    --muted: #8a919c;
    --accent: #2f6fed;
    --border: #e3e7ee;
    --ok: #2e7d32;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; background: rgba(255,255,255,.92); backdrop-filter: blur(4px);
    border-bottom: 1px solid var(--border);
  }
  #toolbar .logo { font-weight: 600; margin-right: 6px; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; line-height: 1.2;
    user-select: none; transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #285fd0; color: #fff; }
  .btn.outline { background: #fff; color: var(--accent); border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); background: #fdecea; color: var(--danger); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--accent); background: rgba(47,111,237,.06); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  #toolbar .spacer { flex: 1; }
  #toolbar .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #fileName { color: var(--ink); font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stage {
    position: fixed; inset: 0; top: 45px; overflow: hidden; padding: 0;
  }
  #mmd-host { position: absolute; inset: 0; display: block; }
  #mmd-host svg {
    display: block; width: 100%; height: 100%;
    max-width: none; max-height: none; background: var(--paper);
  }
  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); text-align: center; padding: 24px;
  }
  #empty .big { font-size: 18px; color: var(--ink); margin-bottom: 4px; }
  #empty.dragover { background: rgba(47,111,237,.06); }
  #error {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    max-width: 70%; padding: 14px 18px; border-radius: 8px;
    background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; text-align: left;
  }
  #node-tooltip {
    position: fixed; z-index: 20; pointer-events: none; display: none;
    max-width: 320px; padding: 8px 10px; border-radius: 6px;
    background: rgba(31,39,51,.94); color: #fff; font-size: 12px; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: pre-wrap;
  }
  #status {
    position: fixed; right: 12px; bottom: 10px; z-index: 10;
    font-size: 11px; color: var(--muted);
    background: rgba(255,255,255,.85); padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--border);
  }

  /* ---- review side panel ---- */
  #side {
    position: fixed; top: 45px; right: 0; bottom: 0; z-index: 30;
    width: 320px; max-width: 86vw; background: #fff;
    border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .2s ease;
    display: flex; flex-direction: column; box-shadow: -6px 0 18px rgba(0,0,0,.06);
  }
  #side.open { transform: translateX(0); }
  #side .head {
    display: flex; align-items: center; gap: 6px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px;
  }
  #side .head .sp { flex: 1; }
  #side .filter {
    display: none; align-items: center; gap: 8px; padding: 6px 12px;
    border-bottom: 1px solid var(--border); background: #f7f9fc; font-size: 12px;
  }
  #side .filter.show { display: flex; }
  #side .filter .f-sym {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; color: var(--accent);
  }
  #side .filter .f-sym .lbl { color: var(--muted); margin-right: 4px; font-family: inherit; }
  #side .list { flex: 1; overflow: auto; padding: 8px 12px; }
  #side .list .empty-hint { color: var(--muted); font-size: 13px; padding: 12px 4px; }
  .rvw {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
    background: #fcfcfd;
  }
  .rvw .r-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .rvw .r-sym { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--accent); background: #eef4ff; border-radius: 4px; padding: 1px 6px; }
  .rvw .r-type {
    font-size: 10px; padding: 1px 6px; border-radius: 999px; text-transform: uppercase; font-weight: 600;
  }
  .rvw .r-type.review { background: #fff3e0; color: #b33900; }
  .rvw .r-type.fix    { background: #fdecea; color: var(--danger); }
  .rvw .r-type.idea   { background: #e3f2fd; color: #0d47a1; }
  .rvw .r-type.question { background: #f3eefd; color: #5e35b1; }
  .rvw .r-txt { font-size: 13px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .rvw .r-del { cursor: pointer; color: var(--muted); font-size: 12px; padding: 0 4px; margin-left: auto; }
  .rvw .r-del:hover { color: var(--danger); }
  .rvw.closed { opacity: .5; }
  .rvw.closed .r-txt { text-decoration: line-through; }
  .r-status {
    cursor: pointer; font-size: 11px; border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; color: var(--muted); white-space: nowrap;
  }
  .r-status:hover { border-color: var(--accent); color: var(--accent); }
  .r-status.open { color: #b33900; border-color: #ffb980; background: #fff7ef; }
  .side-tools { display: flex; align-items: center; gap: 6px; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(18px);
    background: #1f2937; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px;
    z-index: 70; opacity: 0; pointer-events: none; max-width: 80vw;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    transition: opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- comment composer drawer ---- */
  #modal-cover {
    position: fixed; left: 14px; bottom: 14px; z-index: 40;
    width: 340px; max-width: calc(100vw - 28px); display: none;
    border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,.2);
    border: 1px solid var(--border); background: #fff; overflow: hidden;
  }
  #modal-cover.show { display: block; animation: drawerIn .18s ease; }
  @keyframes drawerIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  #composer .pad { padding: 14px 14px 12px; }
  #composer h3 { margin: 0 0 2px; font-size: 15px; }
  #composer .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.45; }
  #composer .anchor {
    font-size: 12px; color: var(--accent); background: #eef4ff; border-radius: 6px;
    padding: 6px 8px; margin-bottom: 10px; word-break: break-all; font-family: ui-monospace, Consolas, monospace;
  }
  #composer .field { margin-bottom: 10px; }
  #composer .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  #composer .type-pick { display: flex; gap: 6px; }
  #composer .type-pick button {
    flex: 1; padding: 5px 0; border: 1px solid var(--border); border-radius: 999px; background: #fff;
    font-size: 12px; cursor: pointer; color: var(--ink); transition: border-color .12s ease, background .12s ease, color .12s ease;
  }
  #composer .type-pick button.active { border-color: var(--accent); color: #fff; background: var(--accent); font-weight: 600; }
  #composer .txtwrap { position: relative; }
  #composer textarea {
    width: 100%; min-height: 80px; resize: vertical; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; line-height: 1.5;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer .txtwrap .count { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted); pointer-events: none; }
  #composer .dfoot { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
  #composer .dfoot .hint { font-size: 11px; color: var(--muted); margin-right: auto; }

  /* ---- suggestion center: search + filter chips in side panel ---- */
  #side .ctrls { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #side .ctrls input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: inherit; background: #fff; }
  #side .ctrls input:focus { outline: none; border-color: var(--accent); }
  #side .chips { display: flex; gap: 6px; margin-top: 6px; }
  #side .chips button {
    flex: 1; cursor: pointer; border: 1px solid var(--border); background: #fff; border-radius: 999px;
    padding: 2px 0; font-size: 11px; color: var(--muted);
  }
  #side .chips button.active { border-color: var(--accent); color: var(--accent); background: #eef4ff; font-weight: 600; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="logo">Mermaid Viewer</span>
    <button class="btn primary" id="btn-open">打开 .mmd</button>
    <button class="btn outline" id="btn-side">建议中心 (<span id="side-count">0</span>)</button>
    <span class="spacer"></span>
    <button class="btn primary" id="btn-export">导出标记</button>
    <button class="btn outline" id="btn-llm" title="把待处理评论汇总成可直接发 LLM 的修复提示词">LLM 修复提示</button>
    <button class="btn outline" id="btn-png">导出 PNG</button>
    <span class="spacer"></span>
    <button class="btn" id="btn-fit">Fit</button>
    <button class="btn" id="btn-in">+ Zoom in</button>
    <button class="btn" id="btn-out">- Zoom out</button>
    <button class="btn" id="btn-reset">Reset</button>
    <span class="spacer"></span>
    <span id="fileName"></span>
    <span class="hint">点击节点/连线条目可评论 · 拖拽平移 / 滚轮缩放</span>
  </div>
  <div id="stage">
    <div id="mmd-host"></div>
    <div id="empty" class="">
      <div class="big">拖拽 .mmd 文件到窗口，或点左上角「打开 .mmd」</div>
      <div>离线运行 · 点击节点/连线可评论 · 平移缩放 / Fit 自适应</div>
    </div>
  </div>
  <div id="side">
    <div class="head">
      建议中心
      <span class="sp"></span>
      <button class="btn ghost sm" id="btn-close-side" title="收起建议面板">✕ 关闭</button>
      <button class="btn danger sm" id="btn-clear-side" title="清空当前文件的全部建议">清空</button>
    </div>
    <div class="filter" id="side-filter">
      <span class="f-sym"><span class="lbl">标注于</span><span id="f-sym"></span></span>
      <button class="btn outline sm" id="f-all">显示全部</button>
    </div>
    <div class="ctrls">
      <input id="side-q" placeholder="搜索节点或关键词…">
      <div class="chips" id="side-chips">
        <button data-k="all" class="active">全部</button>
        <button data-k="open">待处理</button>
        <button data-k="closed">已处理</button>
      </div>
    </div>
    <div class="list" id="rvw-list"></div>
  </div>
  <input type="file" id="fileInput" accept=".mmd,.mermaid,.txt">
  <div id="node-tooltip"></div>
  <div id="status"></div>
  <div id="toast"></div>

  <!-- comment composer drawer -->
  <div id="modal-cover">
    <div id="composer">
      <div class="pad">
        <h3>新批注</h3>
        <div class="sub">写入后挂在对应符号上，可一键导出给 LLM 修复</div>
        <div class="anchor" id="cm-anchor"></div>
        <div class="field">
          <div class="type-pick" id="cm-types">
            <button data-t="review" class="active">问题</button>
            <button data-t="fix">修复</button>
            <button data-t="idea">想法</button>
          </div>
        </div>
        <div class="txtwrap">
          <textarea id="cm-text" maxlength="300" placeholder="这里哪里不对 / 希望怎么改..."></textarea>
          <span class="count" id="cm-count">0 / 300</span>
        </div>
      </div>
      <div class="dfoot">
        <span class="hint">已处理的不含在 LLM 导出</span>
        <button class="btn" id="cm-cancel">取消</button>
        <button class="btn primary" id="cm-save">提交批注</button>
      </div>
    </div>
  </div>

  <script src="./vendor/mermaid.min.js"></script>
  <script src="./vendor/svg-pan-zoom.min.js"></script>
  <script>
    (function () {
      var host = document.getElementById("mmd-host");
      var empty = document.getElementById("empty");
      var fileInput = document.getElementById("fileInput");
      var fileNameEl = document.getElementById("fileName");
      var tip = document.getElementById("node-tooltip");
      var status = document.getElementById("status");
      var panZoom = null;
      var errorBox = null;

      // ---- state: symbols parsed from mmd + reviews (per file) ----
      var currentSrc = "";
      var currentNodeMap = {};   // { displayText_lower: [symbolName,...] }
      var currentEdgeList = [];  // [{sym,label}]  raw edge strings w/ label
      var currentReviews = [];   // [{id,type,sym,date,text}]
      var activeSym = null;      // when set, side list filters to this symbol's reviews
      var currentSvg = null;     // last rendered <svg> element (for PNG export)
      var cleanSvgString = "";   // pristine mermaid SVG (no pan/zoom), for PNG export

      var SYMS_KEY = "mdv_syms"; // fileKey -> reviews object
      var LAST_KEY = "mdv_last_mmd_v1"; // {name,text,ts} remembered last opened file

      // --------------------------------------------------------------
      // mermaid config
      // --------------------------------------------------------------
      mermaid.initialize({
        startOnLoad: false,
        maxTextSize: 500000,
        maxEdges: 200000,
        securityLevel: "loose",
        flowchart: { curve: "basis", htmlLabels: true }
      });

      // --------------------------------------------------------------
      // mmd symbol parsing (best-effort) — build text->symbol map so we
      // can anchor a clicked node/edge back to its .mmd source symbol.
      // --------------------------------------------------------------
      function parseSymbols(src) {
        currentNodeMap = {};
        currentEdgeList = [];

        // strip comments
        var code = src.split("\n").filter(function (l) { return !/^\s*%%/.test(l); }).join("\n");

        // 1) node ids and their display text.
        //    Match: ID["text"] | ID[["text"]] | ID(("text")) | ID(["text"])
        //    also ID--> , ID-.-> anchors without labels are node ids only.
        var re = /([A-Za-z_][A-Za-z0-9_]*)\s*(\[\[|\{|\(\(|\[)([^\]\]]*?)(\]\]|\}\}|\]\)|\])/g;
        // We'll do a simpler two-pass: first collect all NODEDEF patterns.
        var nodeRe = /([A-Za-z_][A-Za-z0-9_]*)\s*(\[\s*\[|\{\{|\(\(|\[)([\s\S]*?)(\]\s*\]|\}\}|\)\)|\])/g;
        var m;
        var defined = {};
        while ((m = nodeRe.exec(code)) !== null) {
          var sym = m[1], inner = m[2], text = m[3];
          // value inside can contain XING marks but not container chars we already captured
          var clean = text.replace(/[X_#]/g, "").replace(/<br\/?>/gi, " ").trim();
          // the outer "]" we matched also matches simple A["b"] and cyl/hex shapes
          if (inner.indexOf("[") === -1 && inner.indexOf("{") === -1 && inner.indexOf("(") === -1) {
            if (clean) defined[sym] = clean;
          } else if (inner.indexOf("(") !== -1 || inner.indexOf("{") !== -1) {
            // stady [[A]] or hex {{A}} or subroutine (A)
            if (clean) defined[sym] = clean;
          }
        }

        // 2) additionally, a bare node used as edge endpoint w/o def may still
        //    appear in repositioning: `A-->B`. We only care about text lookup.

        // index by lowercase display text
        Object.keys(defined).forEach(function (k) {
          var key = String(defined[k]).toLowerCase().trim();
          if (!key) return;
          if (!currentNodeMap[key]) currentNodeMap[key] = [];
          currentNodeMap[key].push(k);
        });

        // 3) edges with labels:  A -->|label| B  /  A-.label.->B / A--text-->B
        var edgeRe = /([A-Za-z_][A-Za-z0-9_]*)\s*(?:-->|\-\.->|--o\-\-|--)|\|([^|]*)\||\s*(?:[\-.])?->?/gi;
        // simplify: capture `-->label-->` pattern and `-. text .->`
        var edgeLabelRe = /([A-Za-z_][A-Za-z0-9_]*)\s*(-\.|\-\-)>?\s*\|\s*([^|]*)\s*\|/g;
        var e;
        while ((e = edgeLabelRe.exec(code)) !== null) {
          var edg = { sym: (e[1] + " -->|" + e[3].trim() + "| ..."), label: e[3].trim() };
          if (edg.label) currentEdgeList.push(edg);
        }
        var edgeDotRe = /([A-Za-z_][A-Za-z0-9_]*)\s*\-\-\s*(.*?)\s*\-\->/g;
        // (kept minimal to avoid false positives)
      }

      // --------------------------------------------------------------
      // reviews persistence
      //   - when served over http (local viewer server), write to SQLite
      //     via fetch /api/reviews so comments survive a reload/reboot.
      //   - otherwise (file://) fall back to localStorage.
      // --------------------------------------------------------------
      var USE_BACKEND = (location.protocol === "http:" || location.protocol === "https:");
      function fileKey() { return fileNameEl.textContent || "(untitled)"; }

      function loadStore() {
        try {
          var o = JSON.parse(localStorage.getItem("mdv_reviews_v1") || "{}");
          return o || {};
        } catch (e) { return {}; }
      }
      function saveStoreLocal() {
        try {
          var all = loadStore();
          all[fileKey()] = currentReviews;
          localStorage.setItem("mdv_reviews_v1", JSON.stringify(all));
        } catch (e) { /* storage blocked */ }
      }
      function pushBackend() { // fire-and-forget; best effort
        if (!USE_BACKEND) return;
        try {
          fetch("/api/reviews/" + encodeURIComponent(fileKey()), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reviews: currentReviews })
          }).then(function (r) {
            if (!r.ok) { /* non-fatal */ }
          }).catch(function () { /* non-fatal */ });
        } catch (e) { /* non-fatal */ }
      }
      function saveStore() { // unified: backend first, then local mirror
        saveStoreLocal();
        pushBackend();
      }
      function loadCurrent() {
        currentReviews = loadStore()[fileKey()] || [];
        updateSideCount();
        renderSideList();
        if (USE_BACKEND) {
          // authoritative copy lives on the server; if it has reviews for
          // this file, adopt them (they may be newer than the local mirror).
          fetch("/api/reviews/" + encodeURIComponent(fileKey()))
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data && Array.isArray(data.reviews) && data.reviews.length) {
                currentReviews = data.reviews;
                saveStoreLocal();
                updateSideCount();
                renderSideList();
                applyBadges();
              }
            }).catch(function () { /* keep local */ });
        }
      }
      function nextId() {
        var max = 0;
        currentReviews.forEach(function (r) { if (r.id > max) max = r.id; });
        return max + 1;
      }

      // --------------------------------------------------------------
      // render + pan zoom
      // --------------------------------------------------------------
      function render(name, src) {
        clearError();
        currentSrc = src;
        fileNameEl.textContent = name;
        cacheLastEdited(name, src);
        parseSymbols(src);
        loadCurrent();
        renderWithMermaid(src);
      }

      // remember the last opened file so we can resume it on next launch
      function cacheLastEdited(name, src) {
        try {
          if (src.length > 1000000) return; // too big to cache safely
          localStorage.setItem(LAST_KEY, JSON.stringify({ name: name, text: src, ts: Date.now() }));
        } catch (e) { /* storage full/blocked — non-fatal */ }
      }
      function restoreLastEdited() {
        try {
          var o = JSON.parse(localStorage.getItem(LAST_KEY) || "null");
          if (o && typeof o.text === "string" && o.text.length <= 1000000) {
            render(o.name || "(上次文件)", o.text);
            return true;
          }
        } catch (e) {}
        return false;
      }

      function renderWithMermaid(src) {
        try {
          mermaid.render("mdv", src).then(function (res) {
            host.innerHTML = res.svg;
            empty.style.display = "none";
            currentSvg = host.querySelector("svg");
            cleanSvgString = res.svg;
            attachInteract();
            bindPanZoom();
            applyBadges();
          }).catch(function (e) {
            showError("渲染失败: " + (e && e.message ? e.message : e));
          });
        } catch (e) {
          showError("渲染异常: " + (e && e.message ? e.message : e));
        }
      }

      function bindPanZoom() {
        var svg = host.querySelector("svg");
        if (!svg) return;
        if (panZoom) panZoom.destroy();
        panZoom = svgPanZoom(svg, {
          zoomEnabled: true, panEnabled: true,
          controlIconsEnabled: false, fit: true, center: true,
          minZoom: 0.1, maxZoom: 10
        });
        updateStatus();
        panZoom.off && null;
      }

      // --------------------------------------------------------------
      // interaction: hover tooltip + click-to-comment (node or edge)
      // Some classes of mermaid comment descriptors:
      //   node:  <g class="node" id="..."><...><text>label</text>
      //   edge:  <g class="edgePaths"><path/></g> ... title gives "A-->|x|B"
      // We map display text -> symbol via currentNodeMap, and edge labels
      // via currentEdgeList (fall back to title text).
      // --------------------------------------------------------------
      var lastClickPt = null;
      var lastClickCls = null;

      function attachInteract() {
        var svg = host.querySelector("svg");
        if (!svg) return;

        // --- edges (click on a path edge) ---
        var edgePaths = svg.querySelectorAll(".edgePaths .edgePath path, .edgePaths .edge-thickness .path");
        Array.prototype.forEach.call(edgePaths, function (p) {
          p.addEventListener("mousemove", function (ev) {
            var t = edgeTitle(p);
            tip.textContent = t || "edge";
            showTip(ev);
          });
          p.addEventListener("mouseleave", function () { tip.style.display = "none"; });
          p.addEventListener("click", function (ev) {
            ev.stopPropagation();
            var t = edgeTitle(p) || "";
            openComposer(t, t);
          });
        });

        // --- nodes ---
        var nodes = svg.querySelectorAll(".node");
        Array.prototype.forEach.call(nodes, function (n) {
          n.addEventListener("mousemove", function (ev) {
            var sym = nodeCommentSym(n);
            tip.textContent = sym;
            showTip(ev);
          });
          n.addEventListener("mouseleave", function () { tip.style.display = "none"; });
          // click on a node (svg-pan-zoom may treat as pan; we only open when
          // not a drag, handled below via mousedown/click delta guard)
        });

        // node clicks with drag guard (svg-pan-zoom pans on drag)
        var startX = 0, startY = 0, downTarget = null, downCls = false;
        svg.addEventListener("mousedown", function (ev) {
          startX = ev.clientX; startY = ev.clientY;
          downTarget = ev.target;
          downCls = ev.target.closest && ev.target.closest(".node");
        });
        svg.addEventListener("click", function (ev) {
          var moved = Math.hypot(ev.clientX - startX, ev.clientY - startY);
          if (moved > 6) return;          // it was a pan, not a click
          var nodeEl = ev.target && ev.target.closest ? ev.target.closest(".node") : null;
          if (nodeEl) {
            ev.stopPropagation();
            var sym = nodeCommentSym(nodeEl);
            openComposer(sym, sym);
          }
        });
      }

      function edgeTitle(p) {
        var t = p.querySelector && p.querySelector("title");
        return t ? t.textContent.trim() : "";
      }

      function nodeCommentSym(nodeEl) {
        // prefer the aria-label (contains display text), map back to mmd symbol
        var textEl = nodeEl.querySelector && (nodeEl.querySelector("text") || nodeEl);
        var disp = (textEl && textEl.textContent) || nodeEl.id;
        disp = disp.replace(/<br\/?>/gi, " ").trim();
        var key = disp.toLowerCase();
        if (currentNodeMap[key] && currentNodeMap[key].length) {
          return "节点 " + currentNodeMap[key][0] + "（" + disp + "）";
        }
        // fallback: node id
        return "节点 " + (nodeEl.id || disp) + "（" + disp + "）";
      }

      // --------------------------------------------------------------
      // composer modal
      // --------------------------------------------------------------
      var composer = document.getElementById("composer");
      var cover = document.getElementById("modal-cover");
      var cmAnchor = document.getElementById("cm-anchor");
      var cmText = document.getElementById("cm-text");
      var cmTypeEl = "review";
      var cmAnchorRaw = "";

      function openComposer(anchor, raw) {
        cmAnchorRaw = raw;
        cmAnchor.textContent = anchor;
        cmText.value = "";
        updateCmCount();
        cmTypeEl = "review";
        setTypePick();
        cover.classList.add("show");
        // reveal this spot's existing reviews in the side panel
        activeSym = raw;
        openSide();
        renderSideList();
        setTimeout(function () { cmText.focus(); }, 30);
      }
      function closeComposer() { cover.classList.remove("show"); cmText.value = ""; }
      var cmCountEl = document.getElementById("cm-count");
      function updateCmCount() { cmCountEl.textContent = cmText.value.length + " / 300"; }

      var toastEl = document.getElementById("toast"), toastTimer = null;
      function showToast(msg, ms) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, ms || 2200);
      }

      function setTypePick() {
        var bts = document.querySelectorAll("#cm-types button");
        Array.prototype.forEach.call(bts, function (b) {
          b.classList.toggle("active", b.getAttribute("data-t") === cmTypeEl);
        });
      }
      Array.prototype.forEach.call(
        document.querySelectorAll("#cm-types button"), function (b) {
          b.addEventListener("click", function () { cmTypeEl = b.getAttribute("data-t"); setTypePick(); });
        });
      document.getElementById("cm-cancel").addEventListener("click", closeComposer);
      document.getElementById("cm-text").addEventListener("input", updateCmCount);
      document.getElementById("cm-save").addEventListener("click", function () {
        var text = cmText.value.trim();
        if (!text) { status.textContent = "意见为空"; return; }
        var rec = { id: nextId(), type: cmTypeEl, sym: cmAnchorRaw || fileKey(), date: new Date().toISOString(), text: text, status: "open" };
        currentReviews.push(rec);
        saveStore();
        updateSideCount();
        renderSideList();
        applyBadges();
        closeComposer();
        openSide();
        status.textContent = "已标注 #" + rec.id;
      });
      cover.addEventListener("click", function (ev) { if (ev.target === cover) closeComposer(); });

      // --------------------------------------------------------------
      // side panel + list + export + clear
      // --------------------------------------------------------------
      var side = document.getElementById("side");
      var sideFilter = document.getElementById("side-filter");
      var fSym = document.getElementById("f-sym");
      function openSide() { side.classList.add("open"); }
      function closeSide() { side.classList.remove("open"); }
      document.getElementById("btn-side").addEventListener("click", function () {
        activeSym = null;   // opening "all reviews" view clears any node filter
        renderSideList();
        side.classList.toggle("open");
      });
      document.getElementById("btn-close-side").addEventListener("click", closeSide);
      document.getElementById("f-all").addEventListener("click", function () {
        activeSym = null;
        renderSideList();
      });
      document.getElementById("btn-clear-side").addEventListener("click", function () {
        if (currentReviews.length && confirm("清空当前文件的全部评论？")) {
          currentReviews = [];
          saveStore();
          updateSideCount();
          renderSideList();
          applyBadges();
        }
      });

      function updateSideCount() {
        document.getElementById("side-count").textContent = currentReviews.length;
      }

      function renderSideList() {
        var list = document.getElementById("rvw-list");
        var items = currentReviews;
        if (activeSym) {
          items = currentReviews.filter(function (r) { return r.sym === activeSym; });
          sideFilter.classList.add("show");
          fSym.textContent = activeSym;
        } else {
          sideFilter.classList.remove("show");
        }
        if (!items.length) {
          list.innerHTML = activeSym
            ? '<div class="empty-hint">这个位置还没有评论。在下方的标注框里写一条吧。</div>'
            : '<div class="empty-hint">还没有评论。点击图上的节点或连线，即可在那一处打标。</div>';
          return;
        }
        list.innerHTML = "";
        items.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (r) {
          var div = document.createElement("div");
          div.className = "rvw" + (r.status === "closed" ? " closed" : "");
          var top = document.createElement("div");
          top.className = "r-top";
          var sym = document.createElement("span");
          sym.className = "r-sym"; sym.textContent = r.sym;
          var typ = document.createElement("span");
          typ.className = "r-type " + r.type; typ.textContent = r.type;
          var st = document.createElement("span");
          var isClosed = r.status === "closed";
          st.className = "r-status " + (isClosed ? "closed" : "open");
          st.textContent = isClosed ? "已处理" : "待处理";
          st.title = "点击切换：已处理 / 待处理（已处理不进入 LLM 导出）";
          st.addEventListener("click", function () {
            r.status = isClosed ? "open" : "closed";
            saveStore();
            renderSideList();
            applyBadges();
          });
          var del = document.createElement("span");
          del.className = "r-del"; del.textContent = "✕";
          del.title = "删除";
          del.addEventListener("click", function () {
            currentReviews = currentReviews.filter(function (x) { return x.id !== r.id; });
            saveStore();
            updateSideCount();
            renderSideList();
            applyBadges();
          });
          top.appendChild(typ); top.appendChild(sym); top.appendChild(st); top.appendChild(del);
          var txt = document.createElement("div");
          txt.className = "r-txt"; txt.textContent = r.text;
          div.appendChild(top);
          div.appendChild(txt);
          list.appendChild(div);
        });
      }

      // --------------------------------------------------------------
      // export markers (scan-mmd-reviews.py compatible)
      // --------------------------------------------------------------
      function buildMarkers() {
        var out = [];
        currentReviews.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (r) {
          out.push("%% [" + r.type + ":" + r.id + "] " + oneLine(r.text));
          out.push("%%   loc: " + oneLine(r.sym));
          if (hasDetail(r.text)) {
            out.push("%%   note: " + r.text.replace(/\s+/g, " ").trim());
          }
        });
        return out.join("\n");
      }
      function oneLine(s) { return s.replace(/\s+/g, " ").trim(); }
      function hasDetail(s) {
        // if the one-liner title already carries the meaning, note is optional.
        return s.length > 60;
      }

      function exportMarkers() {
        if (!currentReviews.length) { status.textContent = "没有可导出的评论"; return; }
        var block = buildMarkers();
        var blob = new Blob([block], { type: "text/plain;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (fileKey() || "reviews") + ".review.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        // Also copy to clipboard if allowed.
        try {
          if (navigator.clipboard) navigator.clipboard.writeText(block);
        } catch (e) {}
        status.textContent = "已导出 " + currentReviews.length + " 条标记（同时复制到剪贴板）";
      }
      document.getElementById("btn-export").addEventListener("click", exportMarkers);

      // --------------------------------------------------------------
      // export PNG (rasterize a pristine, fresh copy of the SVG off-screen)
      // --------------------------------------------------------------
      function exportPNG() {
        if (!cleanSvgString) { status.textContent = "还没有可导出的图"; return; }
        status.textContent = "导出中...";
        // Build a fresh, detached SVG from the pristine string so pan/zoom
        // state and live-DOM attr pollution are ignored.
        var holder = document.createElement("div");
        holder.style.cssText = "position:absolute;left:-10000px;top:-10000px;width:0;height:0;overflow:hidden;";
        holder.innerHTML = cleanSvgString;
        document.body.appendChild(holder);
        var svg = holder.querySelector("svg");
        if (!svg) { holder.remove(); status.textContent = "PNG 导出失败: 未找到 SVG"; return; }

        // Natural content bounds (px), honouring the mmd's own whitespace.
        var bbox = null;
        try { bbox = svg.getBBox(); } catch (e) { bbox = null; }
        var vb = svg.viewBox && svg.viewBox.baseVal;
        var w = vb && vb.width ? vb.width : (bbox && bbox.width ? bbox.width + bbox.x * 2 : 1200);
        var h = vb && vb.height ? vb.height : (bbox && bbox.height ? bbox.height + bbox.y * 2 : 800);

        // Normalise: strip the inline width/height so the Image scales via viewBox.
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        if (vb) {
          svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.width + " " + vb.height);
        }
        var scale = 2;            // 2x zoom for crisp output
        var W = Math.round(w * scale);
        var H = Math.round(h * scale);

        try {
          var src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
          var img = new Image();
          img.onload = function () {
            try {
              var canvas = document.createElement("canvas");
              canvas.width = W; canvas.height = H;
              var ctx = canvas.getContext("2d");
              ctx.fillStyle = "#fbfbfa";
              ctx.fillRect(0, 0, W, H);
              ctx.drawImage(img, 0, 0, W, H);
              canvas.toBlob(function (blob) {
                holder.remove();
                img.src = "";
                if (!blob) { status.textContent = "PNG 导出失败"; return; }
                var a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = (fileKey() || "diagram") + ".png";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                status.textContent = "PNG 已导出 (" + W + "x" + H + ")";
              }, "image/png");
            } catch (e) {
              holder.remove();
              status.textContent = "PNG 导出异常: " + (e && e.message ? e.message : e);
            }
          };
          img.onerror = function () {
            holder.remove();
            status.textContent = "PNG 导出失败: SVG 图片加载出错";
          };
          img.src = src;
        } catch (e) {
          holder.remove();
          status.textContent = "PNG 导出异常: " + (e && e.message ? e.message : e);
        }
      }
      document.getElementById("btn-png").addEventListener("click", exportPNG);

      // --------------------------------------------------------------
      // on-diagram review badges + LLM fix loop
      // --------------------------------------------------------------
      // strip "节点 ID（文本）" down to the raw symbol id used in the SVG
      function symNodeId(sym) {
        if (!sym) return null;
        var m = sym.match(/^节点\s+([A-Za-z0-9_\-.]+)/);
        return m ? m[1] : null;
      }
      // overlay a red count badge at each node that still has open reviews
      function applyBadges() {
        var svg = currentSvg || (host && host.querySelector("svg"));
        if (!svg) return;
        Array.prototype.forEach.call(svg.querySelectorAll(".mdv-badge"), function (el) { el.remove(); });
        var count = {};
        currentReviews.forEach(function (r) {
          if (r.status === "closed") return;
          var id = symNodeId(r.sym);
          if (id) count[id] = (count[id] || 0) + 1;
        });
        var NS = "http://www.w3.org/2000/svg";
        Object.keys(count).forEach(function (id) {
          var g;
          try { g = svg.querySelector('[id="' + id + '"]'); } catch (e) { g = null; }
          if (!g) return;
          var node = g.closest ? g.closest(".node") : (g.classList && g.classList.contains("node") ? g : null);
          if (!node) return;
          var b = null;
          try { b = node.getBBox ? node.getBBox() : null; } catch (e) { b = null; }
          var cx = b ? b.x + b.width - 8 : 8;
          var cy = b ? b.y + 8 : 2;
          var grp = document.createElementNS(NS, "g");
          grp.setAttribute("class", "mdv-badge");
          grp.setAttribute("pointer-events", "none");
          var c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", 8.5);
          c.setAttribute("fill", "#e53935");
          c.setAttribute("stroke", "#fff"); c.setAttribute("stroke-width", "1.2");
          var t = document.createElementNS(NS, "text");
          t.setAttribute("x", cx); t.setAttribute("y", cy + 3.5);
          t.setAttribute("text-anchor", "middle");
          t.setAttribute("font-size", "11"); t.setAttribute("fill", "#fff");
          t.setAttribute("font-family", "system-ui, sans-serif"); t.setAttribute("font-weight", "700");
          t.textContent = count[id];
          grp.appendChild(c); grp.appendChild(t);
          node.appendChild(grp);
        });
      }
      // build a copy-paste prompt that hands all unresolved reviews to an LLM
      function buildLlmPrompt() {
        var open = currentReviews.filter(function (r) { return r.status !== "closed"; });
        if (!open.length) return "";
        var lines = [];
        lines.push("请根据对 mermaid 流程图 <" + (fileKey() || "diagram") + "> 的这些评审意见，输出**修正后的完整 .mmd 源码**。");
        lines.push("约束：只按意见点名位置改动，保留其余结构、符号名与连线方向；loc 是该意见对应的 mmd 符号定位（形如 `节点 符号ID（显示文本）`）。");
        lines.push("");
        open.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (r, i) {
          lines.push((i + 1) + ". loc: " + oneLine(r.sym));
          lines.push("   类型: " + r.type);
          lines.push("   意见: " + oneLine(r.text));
        });
        lines.push("");
        lines.push("输出要求：用 fenced code block（```mermaid ... ```）包裹可直接覆盖保存的完整源码，不加解释。");
        return lines.join("\n");
      }
      document.getElementById("btn-llm").addEventListener("click", function () {
        var p = buildLlmPrompt();
        if (!p) {
          showToast("没有待处理评论（已处理的不含在内）");
          return;
        }
        try { if (navigator.clipboard) navigator.clipboard.writeText(p); } catch (e) { /* non-fatal */ }
        var open = currentReviews.filter(function (r) { return r.status !== "closed"; }).length;
        showToast("已复制 LLM 修复提示词（含 " + open + " 条待处理）");
      });

      // --------------------------------------------------------------
      // open by picker / drag-drop
      // --------------------------------------------------------------
      document.getElementById("btn-open").addEventListener("click", function () {
        if (!pickWithFileSystem()) fileInput.click(); // fall back to native picker
      });
      fileInput.addEventListener("change", function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        readTextFile(f, f.name);
        fileInput.value = "";
      });
      window.addEventListener("dragover", function (ev) { ev.preventDefault(); empty.classList.add("dragover"); });
      window.addEventListener("dragleave", function () { empty.classList.remove("dragover"); });
      window.addEventListener("drop", function (ev) {
        ev.preventDefault();
        empty.classList.remove("dragover");
        var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
        if (!f) return;
        readTextFile(f, f.name);
      });

      function readTextFile(f, name) {
        var reader = new FileReader();
        reader.onload = function () { render(name, String(reader.result)); };
        reader.onerror = function () { status.textContent = "读取文件失败"; };
        reader.readAsText(f, "utf-8");
      }

      // ---- remember last opened file ----
      // Prefer the File System Access API: it hands back a real handle we can
      // store in IndexedDB and re-open next launch (true "remember the path").
      var FS_DB = "mdv_fs_store", FS_STORE = "h", FS_KEY = "last_handle";
      function fsDb() {
        return new Promise(function (res, rej) {
          var rq = indexedDB.open(FS_DB, 1);
          rq.onupgradeneeded = function () { rq.result.createObjectStore(FS_STORE); };
          rq.onsuccess = function () { res(rq.result); };
          rq.onerror = function () { rej(rq.error); };
        });
      }
      function fsPut(handle) {
        fsDb().then(function (db) {
          var tx = db.transaction(FS_STORE, "readwrite");
          tx.objectStore(FS_STORE).put(handle, FS_KEY);
        }).catch(function () { /* non-fatal */ });
      }
      function fsGet() {
        return fsDb().then(function (db) {
          return new Promise(function (res) {
            var tx = db.transaction(FS_STORE, "readonly");
            var r = tx.objectStore(FS_STORE).get(FS_KEY);
            r.onsuccess = function () { res(r.result || null); };
            r.onerror = function () { res(null); };
          });
        }).catch(function () { return null; });
      }
      function fsReadHandle(h) {
        h.requestPermission({ mode: "read" }).then(function (perm) {
          if (perm !== "granted") return;
          h.getFile().then(function (f) { readTextFile(f, h.name); })
            .catch(function () { /* file gone — keep cached copy */ });
        }).catch(function () { /* permission denied */ });
      }
      function pickWithFileSystem() {
        if (!window.showOpenFilePicker) return false;
        window.showOpenFilePicker({
          types: [{ description: "Mermaid 图", accept: { "text/plain": [".mmd", ".mermaid", ".txt"] } }],
          multiple: false
        }).then(function (handles) {
          var h = handles[0];
          fsPut(h);
          fsReadHandle(h);
        }).catch(function () { /* user cancelled */ });
        return true;
      }
      // On launch: first resume the content-cache copy (works everywhere, incl.
      // file://), then if a File System handle is remembered, prefer the live
      // on-disk version once permission is granted.
      (function startRestore() {
        restoreLastEdited();
        if (window.showOpenFilePicker && window.indexedDB) {
          fsGet().then(function (h) { if (h) fsReadHandle(h); });
        }
      })();

      // --------------------------------------------------------------
      // zoom / fit / misc
      // --------------------------------------------------------------
      document.getElementById("btn-fit").addEventListener("click", function () { if (panZoom) { panZoom.fit(); panZoom.center(); } });
      document.getElementById("btn-in").addEventListener("click", function () { if (panZoom) panZoom.zoomIn(); });
      document.getElementById("btn-out").addEventListener("click", function () { if (panZoom) panZoom.zoomOut(); });
      document.getElementById("btn-reset").addEventListener("click", function () { if (panZoom) { panZoom.resetZoom(); panZoom.resetPan(); } });

      function showTip(ev) { var off = 14; tip.style.left = (ev.clientX + off) + "px"; tip.style.top = (ev.clientY + off) + "px"; tip.style.display = "block"; }
      function updateStatus() { if (panZoom) status.textContent = "zoom " + Math.round(panZoom.getZoom() * 100) + "%"; }
      function showError(msg) { clearError(); errorBox = document.createElement("div"); errorBox.id = "error"; errorBox.textContent = msg; document.getElementById("stage").appendChild(errorBox); status.textContent = "error"; }
      function clearError() { if (errorBox) { errorBox.remove(); errorBox = null; } }
    })();
  </script>
</body>
</html>
