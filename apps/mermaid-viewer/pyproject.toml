[project]
name = "mermaid-viewer"
version = "0.1.0"
description = "本地离线 mermaid .mmd 查看器 + 评注持久化（stdlib only, loopback）"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mermaid-viewer = "viewer_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["viewer_server"]