<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Flow Viewer</title>
<style>
  :root {
    --paper: #fbfbfa;
    --ink: #1f2733;
    --muted: #8a919c;
    --accent: #2f6fed;
    --border: #e3e7ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; background: rgba(255,255,255,.92); backdrop-filter: blur(4px);
    border-bottom: 1px solid var(--border);
  }
  #toolbar .btn {
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; line-height: 1.2;
    user-select: none;
  }
  #toolbar .btn:hover { border-color: var(--accent); color: var(--accent); }
  #toolbar .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #toolbar .spacer { flex: 1; }
  #toolbar .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #stage {
    position: fixed; inset: 0; top: 45px; overflow: hidden; padding: 0;
  }
  #mmd-canvas {
    position: absolute; inset: 0; overflow: hidden;
  }
  #mmd-host {
    position: absolute; inset: 0;
    display: block;
  }
  #mmd-host svg {
    display: block;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    background: var(--paper);
  }
  #node-tooltip {
    position: fixed; z-index: 20; pointer-events: none; display: none;
    max-width: 320px; padding: 8px 10px; border-radius: 6px;
    background: rgba(31,39,51,.94); color: #fff; font-size: 12px; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: pre-wrap;
  }
  #status {
    position: fixed; right: 12px; bottom: 10px; z-index: 10;
    font-size: 11px; color: var(--muted);
    background: rgba(255,255,255,.85); padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button class="btn primary" id="btn-fit">Fit</button>
    <button class="btn" id="btn-in">+ Zoom in</button>
    <button class="btn" id="btn-out">- Zoom out</button>
    <button class="btn" id="btn-reset">Reset</button>
    <span class="spacer"></span>
    <span class="hint">Drag to pan &middot; scroll to zoom</span>
  </div>
  <div id="stage">
    <div id="mmd-canvas">
      <div id="mmd-host" class="mermaid"></div>
    </div>
  </div>
  <div id="node-tooltip"></div>
  <div id="status"></div>

  <script src="../../../tools/mermaid-viewer/vendor/mermaid.min.js"></script>
  <script src="../../../tools/mermaid-viewer/vendor/svg-pan-zoom.min.js"></script>
  <script>
    (function () {
      var raw = "flowchart TD\n    %% =====================================================================\n    %% withlanggraph 核心对话流程 (codemap 走查, 依据 apps/withlanggraph/src/gacore/graph.py)\n    %% 焦点: 主图状态机 → process(create_agent) → 记忆维护 的完整流水, 每条边标真实判据\n    %% =====================================================================\n\n    subgraph ENTRY[\"① 入口/触发  (scheduler · proactive · cli · qq · rerun)\"]\n        direction LR\n        SC[\"scheduler.run_job\"]\n        QQ[\"qq 消息/反馈\"]\n        RC[\"proactive / cli / rerun\"]\n    end\n\n    subgraph MAIN[\"② 主图状态机  graph.build_graph() (核心)\"]\n        direction TB\n\n        subgraph FLOW[\"对话主流程\"]\n            S((\"START\")) --> CL[\"classify_message<br/>提取 [IMAGE:] 标记<br/>累积到 pending_images\"]\n            CL -->|\"pending_images 且有文字<br/>或无图无文字\"| PR\n            CL -->|\"pending_images 且无文字\"| WT[\"wait_for_text<br/>interrupt(): 等用户文字<br/>Command(resume=text)->补 HumanMessage<br/>Command(update)->收更多图, 回环\"]\n            WT -->|\"route_after_wait: 恒 process\"| PR\n\n            subgraph PR[\"process = create_agent 子图<br/>(gacore_core)\"]\n                direction LR\n                MD[\"model 节点<br/>调用 LLM\"]\n                TN[(\"tool 节点<br/>27 个工具轮询\")]\n                MD <-->|\"reAct 循环<br/>until END/tool 结束\"| TN\n            end\n\n            PR --> MMX[\"memory_maintain<br/>对话尾部触发长记忆\"]\n            MMX --> CU[\"cleanup_images<br/>去 [IMAGE:]标记·清 pending_images<br/>清 rollover_context/output_mode\"]\n        end\n\n        subgraph SIDE[\"支撑模块\"]\n            direction LR\n            ST[\"state.py GAState<br/>working/轮次/exit_reason\"]\n            MDW[\"middleware 链<br/>GAPrompt → GATurnLogic →<br/>ModelRetry(langchain)\"]\n        end\n    end\n\n    subgraph MM[\"③ 记忆维护  (memory_maintain 内部流程)\"]\n        direction TB\n        TR[\"trigger<br/>CombinedTrigger<br/>(keyword 门 OR 语义召回)\"]\n        TR -->|\"未触发 → 返回 no-op<br/>(不打断对话)\"| TRN[\"no-op\"]\n        TR -->|\"已触发\"| JD[\"judge (LLM)<br/>判定 MERGE / NEW / NOOP\"]\n        JD --> AP[\"apply + persist_entry<br/>唯一写入口<br/>写 global_mem + facts +<br/>向量化 同步 pgvector\"]\n        JD -->|\"NOOP\"| TRN\n        AP --> AU[\"record_audit<br/>→ memory_audit\"]\n    end\n\n    subgraph TOOLS[\"工具集 tools/ (process 的 tool 节点可调用, 按职能归并)\"]\n        direction LR\n        T1[\"web_scan/browser/bili\"]\n        T2[\"daily_notes/memory_tools\"]\n        T3[\"code_run/file_RW\"]\n        T4[\"ncm_* / ocr / ask_user\"]\n        T5[\"send_email/qq_push\"]\n        T6[\"langTrack_stats<br/>读 ETL 事实\"]\n    end\n\n    subgraph LANG[\"⑤ langTrack 数据子系统\"]\n        direction LR\n        IG[\"POST /ingest\"]\n        RW[\"原始层 events\"]\n        ET[\"ETL 事实层\"]\n        OU[\"读方出口<br/>fact_card·report·dashboard·qq_push\"]\n    end\n\n    subgraph OUT[\"④ 退出/投递\"]\n        FB[\"反馈闭环 feedback.py<br/>edit/confirm/redeliver\"]\n        LG[\"jsonl_logger<br/>+ llm_request_log\"]\n    end\n\n    %% ===== 层间边 (带语义) =====\n    SC --> CL\n    QQ --> CL\n    RC --> CL\n\n    ST <--> FLOW\n    MDW -.-> MD\n\n    TN --> T1\n    TN --> T2\n    TN --> T3\n    TN --> T4\n    TN --> T5\n    TN --> T6\n\n    T6 --> OU\n    T2 --- MM\n\n    CL -- 反馈消息 --> FB\n    CU --> LG\n    CU -. 日报正文 .-> FB\n\n    IG --> RW --> ET --> OU";
      var host = document.getElementById("mmd-host");
      var tip = document.getElementById("node-tooltip");
      var status = document.getElementById("status");
      var panZoom = null;

      mermaid.initialize({
        startOnLoad: false,
        maxTextSize: 500000,
        maxEdges: 200000,
        securityLevel: "loose",
        flowchart: { curve: "basis", htmlLabels: true }
      });

      function render() {
        try {
          mermaid.render("archFlow", raw).then(function (res) {
            host.innerHTML = res.svg;
            bindPanZoom();
          });
        } catch (e) {
          console.error("mermaid render failed:", e);
          status.textContent = "mermaid render failed: " + e.message;
        }
      }

      function bindPanZoom() {
        var svg = host.querySelector("svg");
        if (!svg) return;
        if (panZoom) panZoom.destroy();
        panZoom = svgPanZoom(svg, {
          zoomEnabled: true,
          panEnabled: true,
          controlIconsEnabled: false,
          fit: true,
          center: true,
          minZoom: 0.1,
          maxZoom: 10,
          beforePan: function () { return true; }
        });
        updateStatus();
        attachTips(svg);
      }

      // Hover -> show node label/desc tooltip (class -> friendly name)
      function attachTips(svg) {
        var nodes = svg.querySelectorAll(".node");
        Array.prototype.forEach.call(nodes, function (n) {
          n.addEventListener("mousemove", function (ev) {
            var id = n.id;
            var g = host.querySelector('g[aria-labelledby="' + id.replace(/graph-/g, "") + '"]');
            var lbl = (g && g.getAttribute("aria-label")) || id;
            tip.textContent = lbl;
            showTip(ev);
          });
          n.addEventListener("mouseleave", function () { tip.style.display = "none"; });
        });
      }

      function showTip(ev) {
        var off = 14;
        var x = ev.clientX + off, y = ev.clientY + off;
        tip.style.left = x + "px";
        tip.style.top = y + "px";
        tip.style.display = "block";
      }

      function updateStatus() {
        if (!panZoom) return;
        var z = Math.round(panZoom.getZoom() * 100);
        status.textContent = "zoom " + z + "%";
      }

      document.getElementById("btn-fit").addEventListener("click", function () { if (panZoom) panZoom.fit(); panZoom.center(); });
      document.getElementById("btn-in").addEventListener("click", function () { if (panZoom) panZoom.zoomIn(); });
      document.getElementById("btn-out").addEventListener("click", function () { if (panZoom) panZoom.zoomOut(); });
      document.getElementById("btn-reset").addEventListener("click", function () { if (panZoom) { panZoom.resetZoom(); panZoom.resetPan(); } });

      render();
    })();
  </script>
</body>
</html>
