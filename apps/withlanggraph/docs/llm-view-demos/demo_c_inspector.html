oken(app_id, app_secret))\n122|        api = BotAPI(http=http)\n123|        for openid in targets:\n124|            try:\n125|                result = await api.post_c2c_message(\n126|                    openid=openid,\n127|                    msg_type=0,\n128|                    content=content,\n129|                    msg_seq=int(datetime.now().timestamp() * 1000) % (2**31),\n130|                )\n131|                ok += 1\n132|                mid = result.get(\"id\") if isinstance(result, dict) else result\n133|                ids[openid] = str(mid or \"\")\n134|            except Exception as exc:  # noqa: BLE001\n135|                failures.append(openid)\n136|                errors[openid] = str(exc)\n137|    finally:\n138|        try:\n139|            await http.close()\n140|        except Exception:  # noqa: BLE001\n141|            pass\n142|    return {\"ok\": ok, \"failures\": failures, \"errors\": errors, \"ids\": ids}\n143|\n144|\n145|async def _push(content: str, targets: list[str], is_sandbox: bool) -> tuple[int, list[str]]:\n146|    \"\"\"CLI-facing wrapper around :func:`send_c2c`; prints per-recipient results.\"\"\"\n147|    if not targets:\n148|        print(\"没有可推送的目标用户。\")\n149|        return 0, []\n150|\n151|    result = await send_c2c(content, targets, is_sandbox)\n152|    if result.get(\"error\"):\n153|        print(result.get(\"message\", result[\"error\"]))\n154|        sys.exit(1)\n155|\n156|    for openid in targets:\n157|        if openid in result[\"ids\"]:\n158|            print(f\"[ok] {openid} id={result['ids'][openid]}\")\n159|        else:\n160|            print(f\"[fail] {openid}: {result.get('errors', {}).get(openid, 'unknown')}\")\n161|    return int(result[\"ok\"]), list(result[\"failures\"])\n162|\n163|\n164|def main() -> None:\n165|    _fix_encoding()\n166|    parser = argparse.ArgumentParser(description=\"向已知 QQ 用户主动推送私聊消息\")\n167|    parser.add_argument(\"message\", nargs=\"?\", default=None, help=\"要推送的消息内容\")\n168| or:\n62|    \"\"\"Module-level single worker thread; safe to reuse across tool calls.\"\"\"\n63|    global _EXECUTOR\n64|    if _EXECUTOR is None:\n65|        _EXECUTOR = ThreadPoolExecutor(max_workers=1, thread_name_prefix=\"qq-push\")\n66|    return _EXECUTOR\n67|\n68|\n69|def _run_async(coro_factory: Callable[[], Awaitable[dict]]) -> dict:\n70|    \"\"\"Run an async botpy call in a worker thread; returns a dict, never raises.\"\"\"\n71|    def worker() -> dict:\n72|        return asyncio.run(coro_factory())\n73|\n74|    future = _executor().submit(worker)\n75|    try:\n76|        return future.result(timeout=_PUSH_TIMEOUT_S)\n77|    except FutureTimeoutError:\n78|        logger.warning(\"qq_push timed out\", timeout=_PUSH_TIMEOUT_S)\n79|        return {\"error\": \"timeout\", \"message\": f\"推送超时（>{_PUSH_TIMEOUT_S}s）\"}\n80|    except Exception as exc:  # noqa: BLE001 — tools never raise\n81|        logger.error(\n82|            \"qq_push bridge failed\",\n83|            error_type=type(exc).__name__,\n84|            stack_trace=str(exc),\n85|        )\n86|        return {\"error\": \"bridge_failed\", \"message\": str(exc)}\n87|\n88|\n89|def _default_send(content: str, targets: list[str], sandbox: bool) -> dict:\n90|    \"\"\"Real sender: botpy REST over a worker-thread event loop.\"\"\"\n91|    return _run_async(lambda: send_c2c(content, targets, sandbox))\n92|\n93|\n94|@tool\n95|def qq_push(\n96|    message: str,\n97|    to: str | None = None,\n98|) -> QqPushResult | QqPushError:\n99|    \"\"\"主动推送一条私聊消息给主人（已知 QQ 用户）。\n100|\n101|    用于把 langTrack 画像报告、日程/事项提醒等内容主动发给主人。机器人收到过私聊的\n102|    用户 openid 会自动记录在 data/qq_known_users.json（自用场景通常只有主人一个人）。\n103|    - message: 要推送的消息正文。\n104|    - to: 可选，逗号分隔的 openid 列表；通常留空 = 推给全部已知用户（主人）。\n105|    返回结构化结果（status=ok 时含各用户 message id），失败返回 error dict，不抛异常。\n106|    QQ_APP_ID / QQ_APP_SECRET 未配置或 botpy 未安装时返回 error。注意 QQ 平台对主动\n107|    推送有频控/策略限制，不要频繁调用。\n108|    \"\"\"\n109|    targets = [x.strip() for x in (to or \"\").split(\",\") if x.strip()]\n110|    # P2 output-side guard: truncate over-length messages before delivery so the\n111|    # proactive greeting stays ≤200 chars even if the LLM ignores the prompt rule.\n112|    # Audit L-1: the truncation is reported back via ``truncated=True`` on success so\n113|    # callers can tell the user the message was cut instead of failing silently.\n114|    message = (message or \"\").strip()\n115|    truncated = False\n116|    if len(message) > _PUSH_MAX_CHARS:\n117|        logger.warning(\n118|            \"qq_push message truncated\",\n119|            before=len(message),\n120|            max_chars=_PUSH_MAX_CHARS,\n121|        )\n122|        message = message[:_PUSH_MAX_CHARS]\n123|        truncated = True\n124|    if not targets:\n125|        users = load_known_users()\n126|        targets = list(users.keys())\n127|    if not targets:\n128|        return QqPushError(\n129|            error=\"no_recipients\",\n130|            message=\"没有已知 QQ 用户——主人先给机器人发一条私聊即可记录 openid\",\n131|            to=[],\n132|        )\n133|\n134|    result = _default_send(message, targets, False)\n135|    if not isinstance(result, dict):\n136|        result = {\"error\": \"bad_result\", \"message\": f\"发送函数返回异常: {result!r}\"}\n137|    if result.get(\"error\"):\n138|        return QqPushError(\n139|            error=str(result[\"error\"]),\n140|            message=str(result.get(\"message\", \"\")),\n141|            to=targets,\n142|        )\n143|\n144|    ok = int(result.get(\"ok\", 0))\n145|    failures = [str(x) for x in (result.get(\"failures\") or [])]\n146|    ids = {str(k): str(v) for k, v in (result.get(\"ids\") or {}).items()}\n147|    if ok == 0:\n148|        errs = result.get(\"errors\") or {}\n149|        detail = \"；\".join(f\"{o}: {errs[o]}\" for o in failures) or \"unknown\"\n150|        return QqPushError(\n151|            error=\"all_failed\",\n152|            message=f\"全部 {len(targets)} 个目标推送失败：{detail}\",\n153|            to=targets,\n154|        )\n155|\n156|    delivered = [o for o in targets if o not in failures]\n157|    logger.info(\"qq_push sent\", ok=ok, failures=failures, truncated=truncated)\n158|    if truncated:\n159|        return QqPushResult(\n160|            status=\"sent\",\n161|            ok=ok,\n162|            to=delivered,\n163|            failures=failures,\n164|            ids=ids,\n165|            truncated=True,\n166|        )\n167|    return QqPushResult(status=\"sent\", ok=ok, to=delivered, failures=failures, ids=ids)", "name": "file_read", "toolCallId": "call_-7224289095298572859", "toolCalls": []}, {"role": "ai", "chars": 0, "text": "", "name": "gacore_core", "toolCallId": null, "toolCalls": [{"name": "file_read", "args": {"path": "D:\\AAAmyPrj\\github\\myrepos\\mono\\apps\\withlanggraph\\src\\gacore\\langTrack\\qq_push.py"}, "id": "call_-7224290229169946459", "type": "tool_call"}]}, {"role": "tool", "chars": 7741, "text": "1|\"\"\"Proactive QQ push: send a C2C message to known QQ users via botpy.\n2|\n3|The QQ frontend (``gacore.frontends.qq``) records every user's openid into\n4|``data/qq_known_users.json`` as soon as they message the bot. This script reads\n5|that list and pushes an arbitrary message to them — e.g. a personalized report\n6|hoisted from the langTrack pipeline.\n7|\n8|Run with::\n9|\n10|    python -m gacore.langTrack.qq_push \"你好，船长！\"\n11|    python -m gacore.langTrack.qq_push --to <openid> \"只推给指定用户\"\n12|    python -m gacore.langTrack.qq_push --show           # 只列出已知用户，不发消息\n13|\n14|Environment (from the repo root .env)::\n15|\n16|    QQ_APP_ID / QQ_APP_SECRET\n17|\n18|Implementation note: this uses botpy's ``BotHttp``/``BotAPI`` (plain HTTP) instead\n19|of ``Client``. ``Client.start()`` owns the long-lived websocket session and blocks\n20|forever (``_pool_init`` awaits the ws loop), so a one-shot script that calls\n21|``Client`` never reaches the send call — the process just sits there. ``BotHttp``\n22|only fetches an access token and calls the REST API, which exits cleanly.\n23|\n24|Policy notes (QQ Open Platform, 2025):\n25|- C2C proactive pushes require the receiver's openid in the sandbox whitelist\n26|  (沙箱名单) while the bot is in sandbox mode.\n27|- Since 2025-04 Tencent officially discontinued \"主动消息推送\" (proactive push);\n28|  whether the platform still delivers without a recent user message is not\n29|  guaranteed. The most reliable path is a passive reply (with ``msg_id``) within\n30|  5 minutes of a user message.\n31|\"\"\"\n32|from __future__ import annotations\n33|\n34|import argparse\n35|import asyncio\n36|import json\n37|import os\n38|import sys\n39|from datetime import datetime\n40|from pathlib import Path\n41|\n42|from gacore.config import load_dotenv\n43|\n44|load_dotenv()\n45|\n46|# 项目根：src/gacore/langTrack/qq_push.py -> 项目根\n47|_PROJECT_ROOT = Path(__file__).resolve().parents[3]\n48|KNOWN_USERS_FILE = _PROJECT_ROOT / \"data\" / \"qq_known_users.json\"\n49|\n50|\n51|def _fix_encoding() -> None:\n52|    \"\"\"Force stdout/stderr to UTF-8 so Chinese text renders correctly on Windows.\"\"\"\n53|    for stream in (sys.stdout, sys.stderr):\n54|        enc = getattr(stream, \"encoding\", None)\n55|        if enc and enc.upper() != \"UTF-8\":\n56|            try:\n57|                stream.reconfigure(encoding=\"utf-8\", errors=\"replace\")\n58|            except (AttributeError, OSError):\n59|                pass\n60|\n61|\n62|def load_known_users() -> dict[str, dict]:\n63|    \"\"\"Load openid -> info map; missing/corrupt file degrades to {}.\"\"\"\n64|    try:\n65|        raw = json.loads(KNOWN_USERS_FILE.read_text(encoding=\"utf-8\"))\n66|        return {str(k): v for k, v in raw.items() if isinstance(v, dict)}\n67|    except (OSError, ValueError):\n68|        return {}\n69|\n70|\n71|def _show_users(users: dict[str, dict]) -> None:\n72|    if not users:\n73|        print(\"暂无已知用户 —— 先给机器人发一条私聊消息，openid 会被自动记录。\")\n74|        return\n75|    print(f\"已知 QQ 用户（{len(users)}）：\")\n76|    for uid, info in users.items():\n77|        first = (info.get(\"first_seen\") or \"-\")[:19]\n78|        last = (info.get(\"last_seen\") or \"-\")[:19]\n79|        print(f\"  openid={uid}\\n    first_seen={first}  last_seen={last}\")\n80|\n81|\n82|async def send_c2c(\n83|    content: str, targets: list[str], is_sandbox: bool = False\n84|) -> dict:\n85|    \"\"\"Send content to each target openid via botpy BotHttp/BotAPI; return a result dict.\n86|\n87|    Shared by the CLI (``_push``) and the agent tool (``gacore.tools.qq_tools.qq_push``).\n88|\n89|    Unlike ``Client`` (websocket bot loop), ``BotHttp`` is a plain REST client:\n90|    fetch access token -> call POST /v2/users/{openid}/messages -> close. It\n91|    cannot hang on a ws session and exits as soon as the sends are done.\n92|\n93|    Returns ``{\"ok\": n, \"failures\": [openid...], \"errors\": {openid: str},\n94|    \"ids\": {openid: message_id}}``; or ``{\"error\": tag, \"message\": str}`` when\n95|    credentials are missing or botpy is not installed. Never raises.\n96|    \"\"\"\n97|    if not targets:\n98|        return {\"ok\": 0, \"failures\": [], \"errors\": {}, \"ids\": {}}\n99|\n100|    app_id = os.environ.get(\"QQ_APP_ID\", \"\").strip()\n101|    app_secret = os.environ.get(\"QQ_APP_SECRET\", \"\").strip()\n102|    if not app_id or not app_secret:\n103|        return {\n104|            \"error\": \"qq_not_configured\",\n105|            \"message\": \"缺少 QQ_APP_ID / QQ_APP_SECRET（请检查项目根 .env）\",\n106|        }\n107|\n108|    try:\n109|        from botpy import BotAPI  # noqa: PLC0415\n110|        from botpy.http import BotHttp  # noqa: PLC0415\n111|        from botpy.robot import Token  # noqa: PLC0415\n112|    except Exception as exc:  # noqa: BLE001\n113|        return {\"error\": \"botpy_missing\", \"message\": f\"qq-botpy not installed: {exc}\"}\n114|\n115|    http = BotHttp(timeout=15, is_sandbox=is_sandbox)\n116|    ok = 0\n117|    failures: list[str] = []\n118|    errors: dict[str, str] = {}\n119|    ids: dict[str, str] = {}\n120|    try:\n121|        await http.login(Token(app_id, app_secret))\n122|        api = BotAPI(http=http)\n123|        for openid in targets:\n124|            try:\n125|                result = await api.post_c2c_message(\n126|                    openid=openid,\n127|                    msg_type=0,\n128|                    content=content,\n129|                    msg_seq=int(datetime.now().timestamp() * 1000) % (2**31),\n130|                )\n131|                ok += 1\n132|                mid = result.get(\"id\") if isinstance(result, dict) else result\n133|                ids[openid] = str(mid or \"\")\n134|            except Exception as exc:  # noqa: BLE001\n135|                failures.append(openid)\n136|                errors[openid] = str(exc)\n137|    finally:\n138|        try:\n139|            await http.close()\n140|        except Exception:  # noqa: BLE001\n141|            pass\n142|    return {\"ok\": ok, \"failures\": failures, \"errors\": errors, \"ids\": ids}\n143|\n144|\n145|async def _push(content: str, targets: list[str], is_sandbox: bool) -> tuple[int, list[str]]:\n146|    \"\"\"CLI-facing wrapper around :func:`send_c2c`; prints per-recipient results.\"\"\"\n147|    if not targets:\n148|        print(\"没有可推送的目标用户。\")\n149|        return 0, []\n150|\n151|    result = await send_c2c(content, targets, is_sandbox)\n152|    if result.get(\"error\"):\n153|        print(result.get(\"message\", result[\"error\"]))\n154|        sys.exit(1)\n155|\n156|    for openid in targets:\n157|        if openid in result[\"ids\"]:\n158|            print(f\"[ok] {openid} id={result['ids'][openid]}\")\n159|        else:\n160|            print(f\"[fail] {openid}: {result.get('errors', {}).get(openid, 'unknown')}\")\n161|    return int(result[\"ok\"]), list(result[\"failures\"])\n162|\n163|\n164|def main() -> None:\n165|    _fix_encoding()\n166|    parser = argparse.ArgumentParser(description=\"向已知 QQ 用户主动推送私聊消息\")\n167|    parser.add_argument(\" aph\\\\tests\\\\test_proactive_p3.py\\nHIT: D:\\\\AAAmyPrj\\\\github\\\\myrepos\\\\mono\\\\apps\\\\withlanggraph\\\\tests\\\\test_qq.py\\nHIT: D:\\\\AAAmyPrj\\\\github\\\\myrepos\\\\mono\\\\apps\\\\withlanggraph\\\\tests\\\\test_tools_qq_push.py\\n\", \"stderr\": \"\", \"exit_code\": 0, \"timed_out\": false, \"language\": \"python\", \"truncated\": false}", "name": "code_run", "toolCallId": "call_-7224297960111074068", "toolCalls": []}, {"role": "ai", "chars": 0, "text": "", "name": "gacore_core", "toolCallId": null, "toolCalls": [{"name": "file_read", "args": {"path": "D:\\AAAmyPrj\\github\\myrepos\\mono\\apps\\withlanggraph\\src\\gacore\\tools\\qq_tools.py"}, "id": "call_-7224289095298572859", "type": "tool_call"}]}, {"role": "tool", "chars": 6587, "text": "1|\"\"\"QQ proactive push tool for gacore: let the agent push a C2C message to known users.\n2|\n3|Wraps ``gacore.langTrack.qq_push.send_c2c`` (the same botpy BotHttp/BotAPI REST path\n4|the CLI script uses — never ``Client``, whose websocket loop would hang a one-shot\n5|call) into a sync ``@tool`` the agent graph can invoke. The async botpy call is\n6|bridged through a dedicated worker thread so it is safe inside a running event loop\n7|(e.g. the asyncio QQ frontend).\n8|\n9|Recipients default to every openid recorded in ``data/qq_known_users.json`` (the\n10|people who have privately messaged the bot — for this self-hosted setup that is the\n11|owner). Tests replace the module-level ``_default_send`` with a fake via monkeypatch.\n12|\"\"\"\n13|\n14|from __future__ import annotations\n15|\n16|import asyncio\n17|from collections.abc import Awaitable, Callable\n18|from concurrent.futures import ThreadPoolExecutor, TimeoutError as FutureTimeoutError\n19|from typing import Final, Literal, NotRequired, TypedDict\n20|\n21|from langchain_core.tools import tool\n22|\n23|from gacore.jsonl_logger import get_logger\n24|from gacore.langTrack.qq_push import load_known_users, send_c2c\n25|\n26|logger = get_logger(\"tools.qq_tools\")\n27|\n28|_PUSH_TIMEOUT_S: Final = 90\n29|\n30|# P2 output-side guard (design doc §5.5 \"工具侧再校验一次\"): QQ private-message\n31|# reading is best under ~200 chars; anything longer is truncated before delivery.\n32|_PUSH_MAX_CHARS: Final = 200\n33|\n34|_EXECUTOR: ThreadPoolExecutor | None = None\n35|\n36|\n37|class QqPushResult(TypedDict):\n38|    \"\"\"Successful push: how many recipients got it, who, and the platform message ids.\n39|\n40|    ``truncated`` (audit L-1) is only set when the over-length message was cut to\n41|    ``_PUSH_MAX_CHARS`` before delivery — a signal the caller can surface to the user\n42|    (e.g. \"消息被截断，全文见报告\") instead of silently losing the tail.\n43|    \"\"\"\n44|\n45|    status: Literal[\"sent\"]\n46|    ok: int\n47|    to: list[str]\n48|    failures: list[str]\n49|    ids: dict[str, str]\n50|    truncated: NotRequired[bool]\n51|\n52|\n53|class QqPushError(TypedDict):\n54|    \"\"\"Failed push: machine-readable tag, human message and the intended recipients.\"\"\"\n55|\n56|    error: str\n57|    message: str\n58|    to: list[str]\n59|\n60|\n61|def _executor() -> ThreadPoolExecutor:\n62|    \"\"\"Module-level single worker thread; safe to reuse across tool calls.\"\"\"\n63|    global _EXECUTOR\n64|    if _EXECUTOR is None:\n65|        _EXECUTOR = ThreadPoolExecutor(max_workers=1, thread_name_prefix=\"qq-push\")\n66|    return _EXECUTOR\n67|\n68|\n69|def _run_async(coro_factory: Callable[[], Awaitable[dict]]) -> dict:\n70|    \"\"\"Run an async botpy call in a worker thread; returns a dict, never raises.\"\"\"\n71|    def worker() -> dict:\n72|        return asyncio.run(coro_factory())\n73|\n74|    future = _executor().submit(worker)\n75|    try:\n76|        return future.result(timeout=_PUSH_TIMEOUT_S)\n77|    except FutureTimeoutError:\n78|        logger.warning(\"qq_push timed out\", timeout=_PUSH_TIMEOUT_S)\n79|        return {\"error\": \"timeout\", \"message\": f\"推送超时（>{_PUSH_TIMEOUT_S}s）\"}\n80|    except Exception as exc:  # noqa: BLE001 — tools never raise\n81|        logger.error(\n82|            \"qq_push bridge failed\",\n83|            error_type=type(exc).__name__,\n84|            stack_trace=str(exc),\n85|        )\n86|        return {\"error\": \"bridge_failed\", \"message\": str(exc)}\n87|\n88|\n89|def _default_send(content: str, targets: list[str], sandbox: bool) -> dict:\n90|    \"\"\"Real sender: botpy REST over a worker-thread event loop.\"\"\"\n91|    return _run_async(lambda: send_c2c(content, targets, sandbox))\n92|\n93|\n94|@tool\n95|def qq_push(\n96|    message: str,\n97|    to: str | None = None,\n98|) -> QqPushResult | QqPushError:\n99|    \"\"\"主动推送一条私聊消息给主人（已知 QQ 用户）。\n100|\n101|    用于把 langTrack 画像报告、日程/事项提醒等内容主动发给主人。机器人收到过私聊的\n102|    用户 openid 会自动记录在 data/qq_known_users.json（自用场景通常只有主人一个人）。\n103|    - message: 要推送的消息正文。\n104|    - to: 可选，逗号分隔的 openid 列表；通常留空 = 推给全部已知用户（主人）。\n105|    返回结构化结果（status=ok 时含各用户 message id），失败返回 error dict，不抛异常。\n106|    QQ_APP_ID / QQ_APP_SECRET 未配置或 botpy 未安装时返回 error。注意 QQ 平台对主动\n107|    推送有频控/策略限制，不要频繁调用。\n108|    \"\"\"\n109|    targets = [x.strip() for x in (to or \"\").split(\",\") if x.strip()]\n110|    # P2 output-side guard: truncate over-length messages before delivery so the\n111|    # proactive greeting stays ≤200 chars even if the LLM ignores the prompt rule.\n112|    # Audit L-1: the truncation is reported back via ``truncated=True`` on success so\n113|    # callers can tell the user the message was cut instead of failing silently.\n114|    message = (message or \"\").strip()\n115|    truncated = False\n116|    if len(message) > _PUSH_MAX_CHARS:\n117|        logger.warning(\n118|            \"qq_push message truncated\",\n119|            before=len(message),\n120|            max_chars=_PUSH_MAX_CHARS,\n121|        )\n122|        message = message[:_PUSH_MAX_CHARS]\n123|        truncated = True\n124|    if not targets:\n125|        users = load_known_users()\n126|        targets = list(users.keys())\n127|    if not t pe": "tool_call"}]}, {"role": "tool", "chars": 7741, "text": "1|\"\"\"Proactive QQ push: send a C2C message to known QQ users via botpy.\n2|\n3|The QQ frontend (``gacore.frontends.qq``) records every user's openid into\n4|``data/qq_known_users.json`` as soon as they message the bot. This script reads\n5|that list and pushes an arbitrary message to them — e.g. a personalized report\n6|hoisted from the langTrack pipeline.\n7|\n8|Run with::\n9|\n10|    python -m gacore.langTrack.qq_push \"你好，船长！\"\n11|    python -m gacore.langTrack.qq_push --to <openid> \"只推给指定用户\"\n12|    python -m gacore.langTrack.qq_push --show           # 只列出已知用户，不发消息\n13|\n14|Environment (from the repo root .env)::\n15|\n16|    QQ_APP_ID / QQ_APP_SECRET\n17|\n18|Implementation note: this uses botpy's ``BotHttp``/``BotAPI`` (plain HTTP) instead\n19|of ``Client``. ``Client.start()`` owns the long-lived websocket session and blocks\n20|forever (``_pool_init`` awaits the ws loop), so a one-shot script that calls\n21|``Client`` never reaches the send call — the process just sits there. ``BotHttp``\n22|only fetches an access token and calls the REST API, which exits cleanly.\n23|\n24|Policy notes (QQ Open Platform, 2025):\n25|- C2C proactive pushes require the receiver's openid in the sandbox whitelist\n26|  (沙箱名单) while the bot is in sandbox mode.\n27|- Since 2025-04 Tencent officially discontinued \"主动消息推送\" (proactive push);\n28|  whether the platform still delivers without a recent user message is not\n29|  guaranteed. The most reliable path is a passive reply (with ``msg_id``) within\n30|  5 minutes of a user message.\n31|\"\"\"\n32|from __future__ import annotations\n33|\n34|import argparse\n35|import asyncio\n36|import json\n37|import os\n38|import sys\n39|from datetime import datetime\n40|from pathlib import Path\n41|\n42|from gacore.config import load_dotenv\n43|\n44|load_dotenv()\n45|\n46|# 项目根：src/gacore/langTrack/qq_push.py -> 项目根\n47|_PROJECT_ROOT = Path(__file__).resolve().parents[3]\n48|K data/qq_known_users.json`` (the\n10|people who have privately messaged the bot — for this self-hosted setup that is the\n11|owner). Tests replace the module-level ``_default_send`` with a fake via monkeypatch.\n12|\"\"\"\n13|\n14|from __future__ import annotations\n15|\n16|import asyncio\n17|from collections.abc import Awaitable, Callable\n18|from concurrent.futures import ThreadPoolExecutor, TimeoutError as FutureTimeoutError\n19|from typing import Final, Literal, NotRequired, TypedDict\n20|\n21|from langchain_core.tools import tool\n22|\n23|from gacore.jsonl_logger import get_logger\n24|from gacore.langTrack.qq_push import load_known_users, send_c2c\n25|\n26|logger = get_logger(\"tools.qq_tools\")\n27|\n28|_PUSH_TIMEOUT_S: Final = 90\n29|\n30|# P2 output-side guard (design doc §5.5 \"工具侧再校验一次\"): QQ private-message\n31|# reading is best under ~200 chars; anything longer is truncated before delivery.\n32|_PUSH_MAX_CHARS: Final = 200\n33|\n34|_EXECUTOR: ThreadPoolExecutor | None = None\n35|\n36|\n37|class QqPushResult(TypedDict):\n38|    \"\"\"Successful push: how many recipients got it, who, and the platform message ids.\n39|\n40|    ``truncated`` (audit L-1) is only set when the over-length message was cut to\n41|    ``_PUSH_MAX_CHARS`` before delivery — a signal the caller can surface to the user\n42|    (e.g. \"消息被截断，全文见报告\") instead of silently losing the tail.\n43|    \"\"\"\n44|\n45|    status: Literal[\"sent\"]\n46|    ok: int\n47|    to: list[str]\n48|    failures: list[str]\n49|    ids: dict[str, str]\n50|    truncated: NotRequired[bool]\n51|\n52|\n53|class QqPushError(TypedDict):\n54|    \"\"\"Failed push: machine-readable tag, human message and the intended recipients.\"\"\"\n55|\n56|    error: str\n57|    message: str\n58|    to: list[str]\n59|\n60|\n61|def _executor() -> ThreadPoolExecutor:\n62|    \"\"\"Module-level single worker thread; safe to reuse across tool calls.\"\"\"\n63|    global _EXECUTOR\n64|    if _EXECUTOR is None:\n65|        _EXECUTOR = ThreadPoolExecutor(max_workers=1, thread_name_prefix=\"qq-push\")\n66|    return _EXECUTOR\n67|\n68|\n69|def _run_async(coro_factory: Callable[[], Awaitable[dict]]) -> dict:\n70|    \"\"\"Run an async botpy call in a worker thread; returns a dict, never raises.\"\"\"\n71|    def worker() -> dict:\n72|        return asyncio.run(coro_factory())\n73|\n74|    future = _executor().submit(worker)\n75|    try:\n76|        return future.result(timeout=_PUSH_TIMEOUT_S)\n77|    except FutureTimeoutError:\n78|        logger.warning(\"qq_push timed out\", timeout=_PUSH_TIMEOUT_S)\n79|        return {\"error\": \"timeout\", \"message\": f\"推送超时（>{_PUSH_TIMEOUT_S}s）\"}\n80|    except Exception as exc:  # noqa: BLE001 — tools never raise\n81|        logger.error(\n82|            \"qq_push bridge failed\",\n83|            error_type=type(exc).__name__,\n84|            stack_trace=str(exc),\n85|        )\n86|        return {\"error\": \"bridge_failed\", \"message\": str(exc)}\n87|\n88|\n89|def _default_send(content: str, targets: list[str], sandbox: bool) -> dict:\n90|    \"\"\"Real sender: botpy REST over a worker-thread event loop.\"\"\"\n91|    return _run_async(lambda: send_c2c(content, targets, sandbox))\n92|\n93|\n94|@tool\n95|def qq_push(\n96|    message: str,\n97|    to: str | None = None,\n98|) -> QqPushResult | QqPushError:\n99|    \"\"\"主动推送一条私聊消息给主人（已知 QQ 用户）。\n100|\n101|    用于把 langTrack 画像报告、日程/事项提醒等内容主动发给主人。机器人收到过私聊的\n102|    用户 openid 会自动记录在 data/qq_known_users.json（自用场景通常只有主人一个人）。\n103|    - message: 要推送的消息正文。\n104|    - to: 可选，逗号分隔的 openid 列表；通常留空 = 推给全部已知用户（主人）。\n105|    返回结构化结果（status=ok 时含各用户 message id），失败返回 error dict，不抛异常。\n106|    QQ_APP_ID / QQ_APP_SECRET 未配置或 botpy 未安装时返回 error。注意 QQ 平台对主动\n107|    推送有频控/策略限制，不要频繁调用。\n108|    \"\"\"\n109|    targets = [x.strip() for x in (to or \"\").split(\",\") if x.strip()]\n110|    # P2 output-side guard: truncate over-length messages before delivery so the\n111|    # proactive greeting stays ≤200 chars even if the LLM ignores the prompt rule.\n112|    # Audit L-1: the truncation is reported back via ``truncated=True`` on success so\n113|    # callers can tell the user the message was cut instead of failing silently.\n114|    message = (message or \"\").strip()\n115|    truncated = False\n116|    if len(message) > _PUSH_MAX_CHARS:\n117|        logger.warning(\n118|            \"qq_push message truncated\",\n119|            before=len(message),\n120|            max_chars=_PUSH_MAX_CHARS,\n121|        )\n122|        message = message[:_PUSH_MAX_CHARS]\n123|        truncated = True\n124|    if not targets:\n125|        users = load_known_users()\n126|        targets = list(users.keys())\n127|    if not targets:\n128|        return QqPushError(\n129|            error=\"no_recipients\",\n130|            message=\"没有已知 QQ 用户——主人先给机器人发一条私聊即可记录 openid\",\n131|            to=[],\n132|        )\n133|\n134|    result = _default_send(message, targets, False)\n135|    if not isinstance(result, dict):\n136|        result = {\"error\": \"bad_result\", \"message\": f\"发送函数返回异常: {result!r}\"}\n137|    if result.get(\"error\"):\n138|        return QqPushError(\n139|            error=str(result[\"error\"]),\n140|            message=str(result.get(\"message\", \"\")),\n141|            to=targets,\n142|        )\n143|\n144|    ok = int(result.get(\"ok\", 0))\n145|    failures = [str(x) for x in (result.get(\"failures\") or [])]\n146|    ids = {str(k): str(v) for k, v in (result.get(\"ids\") or {}).items()}\n147|    if ok == 0:\n148|        errs = result.get(\"errors\") or {}\n149|        detail = \"；\".join(f\"{o}: {errs[o]}\" for o in failures) or \"unknown\"\n150|        return QqPushError(\n151|            error=\"all_failed\",\n152|            message=f\"全部 {len(targets)} 个目标推送失败：{detail}\",\n153|            to=targets,\n154|        )\n155|\n156|    delivered = [o for o in targets if o not in failures]\n157|    logger.info(\"qq_push sent\", ok=ok, failures=failures, truncated=truncated)\n158| cated=True`` on success so\n113|    # callers can tell the user the message was cut instead of failing silently.\n114|    message = (message or \"\").strip()\n115|    truncated = False\n116|    if len(message) > _PUSH_MAX_CHARS:\n117|        logger.warning(\n118|            \"qq_push message truncated\",\n119|            before=len(message),\n120|            max_chars=_PUSH_MAX_CHARS,\n121|        )\n122|        message = message[:_PUSH_MAX_CHARS]\n123|        truncated = True\n124|    if not targets:\n125|        users = load_known_users()\n126|        targets = list(users.keys())\n127|    if not targets:\n128|        return QqPushError(\n129|            error=\"no_recipients\",\n130|            message=\"没有已知 QQ 用户——主人先给机器人发一条私聊即可记录 openid\",\n131|            to=[],\n132|        )\n133|\n134|    result = _default_send(message, targets, False)\n135|    if not isinstance(result, dict):\n136|        result = {\"error\": \"bad_result\", \"message\": f\"发送函数返回异常: {result!r}\"}\n137|    if result.get(\"error\"):\n138|        return QqPushError(\n139|            error=str(result[\"error\"]),\n140|            message=str(result.get(\"message\", \"\")),\n141|            to=targets,\n142|        )\n143|\n144|    ok = int(result.get(\"ok\", 0))\n145|    failures = [str(x) for x in (result.get(\"failures\") or [])]\n146|    ids = {str(k): str(v) for k, v in (result.get(\"ids\") or {}).items()}\n147|    if ok == 0:\n148|        errs = result.get(\"errors\") or {}\n149|        detail = \"；\".join(f\"{o}: {errs[o]}\" for o in failures) or \"unknown\"\n150|        return QqPushError(\n151|            error=\"all_failed\",\n152|            message=f\"全部 {len(targets)} 个目标推送失败：{detail}\",\n153|            to=targets,\n154|        )\n155|\n156|    delivered = [o for o in targets if o not in failures]\n157|    logger.info(\"qq_push sent\", ok=ok, failures=failures, truncated=truncated)\n158|    if truncated:\n159|        return QqPushResult(\n160|            status=\"sent\",\n161| ontent: str, targets: list[str], is_sandbox: bool = False\n84|) -> dict:\n85|    \"\"\"Send content to each target openid via botpy BotHttp/BotAPI; return a result dict.\n86|\n87|    Shared by the CLI (``_push``) and the agent tool (``gacore.tools.qq_tools.qq_push``).\n88|\n89|    Unlike ``Client`` (websocket bot loop), ``BotHttp`` is a plain REST client:\n90|    fetch access token -> call POST /v2/users/{openid}/messages -> close. It\n91|    cannot hang on a ws session and exits as soon as the sends are done.\n92|\n93|    Returns ``{\"ok\": n, \"failures\": [openid...], \"errors\": {openid: str},\n94|    \"ids\": {openid: message_id}}``; or ``{\"error\": tag, \"message\": str}`` when\n95|    credentials are missing or botpy is not installed. Never raises.\n96|    \"\"\"\n97|    if not targets:\n98|        return {\"ok\": 0, \"failures\": [], \"errors\": {}, \"ids\": {}}\n99|\n100|    app_id = os.environ.get(\"QQ_APP_ID\", \"\").strip()\n101|    app_secret = os.environ.get(\"QQ_APP_SECRET\", \"\").strip()\n102|    if not app_id or not app_secret:\n103|        return {\n104|            \"error\": \"qq_not_configured\",\n105|            \"message\": \"缺少 QQ_APP_ID / QQ_APP_SECRET（请检查项目根 .env）\",\n106|        }\n107|\n108|    try:\n109|        from botpy import BotAPI  # noqa: PLC0415\n110|        from botpy.http import BotHttp  # noqa: PLC0415\n111|        from botpy.robot import Token  # noqa: PLC0415\n112|    except Exception as exc:  # noqa: BLE001\n113|        return {\"error\": \"botpy_missing\", \"message\": f\"qq-botpy not installed: {exc}\"}\n114|\n115|    http = BotHttp(timeout=15, is_sandbox=is_sandbox)\n116|    ok = 0\n117|    failures: list[str] = []\n118|    errors: dict[str, str] = {}\n119|    ids: dict[str, str] = {}\n120|    try:\n121|        await http.login(Token(app_id, app_secret))\n122|        api = BotAPI(http=http)\n123|        for openid in targets:\n124|            try:\n125|                result = await api.post_c2c_message(\n126| chars": 0, "text": "", "name": "gacore_core", "toolCallId": null, "toolCalls": [{"name": "file_read", "args": {"path": "D:\\AAAmyPrj\\github\\myrepos\\mono\\apps\\withlanggraph\\src\\gacore\\tools\\qq_tools.py"}, "id": "call_-7224289095298572859", "type": "tool_call"}]}, {"role": "tool", "chars": 6587, "text": "1|\"\"\"QQ proactive push tool for gacore: let the agent push a C2C message to known users.\n2|\n3|Wraps ``gacore.langTrack.qq_push.send_c2c`` (the same botpy BotHttp/BotAPI REST path\n4|the CLI script uses — never ``Client``, whose websocket loop would hang a one-shot\n5|call) into a sync ``@tool`` the agent graph can invoke. The async botpy call is\n6|bridged through a dedicated worker thread so it is safe inside a running event loop\n7|(e.g. the asyncio QQ frontend).\n8|\n9|Recipients default to every openid recorded in ``data/qq_known_users.json`` (the\n10|people who have privately messaged the bot — for this self-hosted setup that is the\n11|owner). Tests replace the module-level ``_default_send`` with a fake via monkeypatch.\n12|\"\"\"\n13|\n14|from __future__ import annotations\n15|\n16|import asyncio\n17|from collections.abc import Awaitable, Callable\n18|from concurrent.futures import ThreadPoolExecutor, TimeoutError as FutureTimeoutError\n19|from typing import Final, Literal, NotRequired, TypedDict\n20|\n21|from langchain_core.tools import tool\n22|\n23|from gacore.jsonl_logger import get_logger\n24|from gacore.langTrack.qq_push import load_known_users, send_c2c\n25|\n26|logger = get_logger(\"tools.qq_tools\")\n27|\n28|_PUSH_TIMEOUT_S: Final = 90\n29|\n30|# P2 output-side guard (design doc §5.5 \"工具侧再校验一次\"): QQ private-message\n31|# reading is best under ~200 chars; anything longer is truncated before delivery.\n32|_PUSH_MAX_CHARS: Final = 200\n33|\n34|_EXECUTOR: ThreadPoolExecutor | None = None\n35|\n36|\n37|class QqPushResult(TypedDict):\n38|    \"\"\"Successful push: how many recipients got it, who, and the platform message ids.\n39|\n40|    ``t rn _run_async(lambda: send_c2c(content, targets, sandbox))\n92|\n93|\n94|@tool\n95|def qq_push(\n96|    message: str,\n97|    to: str | None = None,\n98|) -> QqPushResult | QqPushError:\n99|    \"\"\"主动推送一条私聊消息给主人（已知 QQ 用户）。\n100|\n101|    用于把 langTrack 画像报告、日程/事项提醒等内容主动发给主人。机器人收到过私聊的\n102|    用户 openid 会自动记录在 data/qq_known_users.json（自用场景通常只有主人一个人）。\n103|    - message: 要推送的消息正文。\n104|    - to: 可选，逗号分隔的 openid 列表；通常留空 = 推给全部已知用户（主人）。\n105|    返回结构化结果（status=ok 时含各用户 message id），失败返回 error dict，不抛异常。\n106|    QQ_APP_ID / QQ_APP_SECRET 未配置或 botpy 未安装时返回 error。注意 QQ 平台对主动\n107|    推送有频控/策略限制，不要频繁调用。\n108|    \"\"\"\n109|    targets = [x.strip() for x in (to or \"\").split(\",\") if x.strip()]\n110|    # P2 output-side guard: truncate over-length messages before delivery so the\n111|    # proactive greeting stays ≤200 chars even if the LLM ignores the prompt rule.\n112|    # Audit L-1: the truncation is reported back via ``truncated=True`` on success so\n113|    # callers can tell the user the message was cut instead of failing silently.\n114|    message = (message or \"\").strip()\n115|    truncated = False\n116|    if len(message) > _PUSH_MAX_CHARS:\n117|        logger.warning(\n118|            \"qq_push message truncated\",\n119|            before=len(message),\n120|            max_chars=_PUSH_MAX_CHARS,\n121|        )\n122|        message = message[:_PUSH_MAX_CHARS]\n123|        truncated = True\n124|    if not targets:\n125|        users = load_known_users()\n126|        targets = list(users.keys())\n127|    if not targets:\n128|        return QqPushError(\n129|            error=\"no_recipients\",\n130|            message=\"没有已知 QQ 用户——主人先给机器人发一条私聊即可记录 openid\",\n131|            to=[],\n132|        )\n133|\n134|    result = _default_send(message, targets, False)\n135|    if not isinstance(result, dict):\n136|        result = {\"error\": \"bad_result\", \"message\": f\"发送函数返回异常: {result!r}\"}\n137|    if result.get(\"error\"):\n138|        return QqPushError(\n139| emory\\\\daily\\\\2026-09-09.md\"}", "name": "edit_daily", "toolCallId": "call_00_llobboeUGsN0P1wJQvsB3703", "toolCalls": []}, {"role": "ai", "chars": 168, "text": "办妥了就好——昨日那条路没白指。临时证当日可取、婚姻登记认它，周六这一关的头一道坎算是迈过去了。\n\n还剩两件收尾的琐事，莫忘了：**动身前先电婚姻登记处**问一句周六（九月十二）办公时辰、凭临时证可否办理；**户口本**与两人照片随身带齐。\n\n这两日且把心放稳，好事将近，别再为张证翻来覆去。韩某记下了，届时若有章程要问，言语一声便是。", "name": "gacore_core", "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 69, "text": "[本条消息真实时间 2026-09-09 19:20:10 星期三 (UTC+8)]\n今天在拍结婚登记照的时候，在放你的名字的歌曲，好好听", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "ai", "chars": 65, "text": "哦？韩某这等凡人名讳，竟也入了曲子——怕是哪个说书人编的段子。道友若记得歌名，说与韩某听听，也好见识见识，外头把我唱成了什么模样。", "name": "gacore_core", "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 66, "text": "[本条消息真实时间 2026-09-09 19:21:50 星期三 (UTC+8)]\n不不不，这首歌曲是  你的名字 这个动漫的歌曲", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "ai", "chars": 101, "text": "原来是《你的名字。》——新海诚那部片子的曲子。韩某孤陋，只听过名头，不曾看过。不过道友在登记照的当口听着这歌，倒是应景：片名正合你二人今日的事。\n\n若是中意那几首插曲，记个名来，改日寻来给你听听也无妨。", "name": "gacore_core", "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 61, "text": "[本条消息真实时间 2026-09-09 22:51:04 星期三 (UTC+8)]\n今天吃了一个烧烤特别难吃，给你发一下", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 42, "text": "[本条消息真实时间 2026-09-09 22:51:12 星期三 (UTC+8)]", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "ai", "chars": 74, "text": "<summary>道友吐槽烧烤难吃，未见图先应一声，待图到再评。<\/summary>\n\n难吃到要专门发来给韩某看——那必是真难吃。图呢，发来我瞧瞧。", "name": "gacore_core", "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 529, "text": "[本条消息真实时间 2026-09-09 22:52:18 星期三 (UTC+8)]\n[用户发送了 1 张图片，以下是每张图片 OCR 识别出的文字内容。请基于识别内容理解图片并分析，直接给出结论，不要复述原始识别文本。]\n图片 1（D:\\AAAmyPrj\\github\\myrepos\\mono\\apps\\withlanggraph\\temp\\qq_img_5270431CCFE7063EA0B30D0D396D91BF_0_1788965525.jpg）：\n22:51\n30\n韩立在线>\n品品品品可贝道友这声笑，比那句“可以\"实在多了一一韩某先记下了。\n今天吃了一个烧烤特别难吃，给你发一下思考中...\n22:50\n还结合了番头烟火气小吃比如配料丰富可甜可盐的夜豆浆以及可以dy的精米饭一秦淮烤牛肉（明园社区店）\n收建43\n答无分 09-09 19:20:10 星期三 (UTC+8)]\n今天在拍结婚登记照的时候，在放你的名字的歌曲，好好听", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "ai", "chars": 65, "text": "哦？韩某这等凡人名讳，竟也入了曲子——怕是哪个说书人编的段子。道友若记得歌名，说与韩某听听，也好见识见识，外头把我唱成了什么模样。", "name": "gacore_core", "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 66, "text": "[本条消息真实时间 2026-09-09 19:21:50 星期三 (UTC+8)]\n不不不，这首歌曲是  你的名字 这个动漫的歌曲", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "ai", "chars": 101, "text": "原来是《你的名字。》——新海诚那部片子的曲子。韩某孤陋，只听过名头，不曾看过。不过道友在登记照的当口听着这歌，倒是应景：片名正合你二人今日的事。\n\n若是中意那几首插曲，记个名来，改日寻来给你听听也无妨。", "name": "gacore_core", "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 61, "text": "[本条消息真实时间 2026-09-09 22:51:04 星期三 (UTC+8)]\n今天吃了一个烧烤特别难吃，给你发一下", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 42, "text": "[本条消息真实时间 2026-09-09 22:51:12 星期三 (UTC+8)]", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "ai", "chars": 74, "text": "<summary>道友吐槽烧烤难吃，未见图先应一声，待图到再评。<\/summary>\n\n难吃到要专门发来给韩某看——那必是真难吃。图呢，发来我瞧瞧。", "name": "gacore_core", "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 529, "text": "[本条消息真实时间 2026-09-09 22:52:18 星期三 (UTC+8)]\n[用户发送了 1 张图片，以下是每张图片 OCR 识别出的文字内容。请基于识别内容理解图片并分析，直接给出结论，不要复述原始识别文本。]\n图片 1（D:\\AAAmyPrj\\github\\myrepos\\mono\\apps\\withlanggraph\\temp\\qq_img_5270431CCFE7063EA0B30D0D396D91BF_0_1788965525.jpg）：\n22:51\n30\n韩立在线>\n品品品品可贝道友这声笑，比那句“可以\"实在多了一一韩某先记下了。\n今天吃了一个烧烤特别难吃，给你发一下思考中...\n22:50\n还结合了番头烟火气小吃比如配料丰富可甜可盐的夜豆浆以及可以dy的精米饭一秦淮烤牛肉（明园社区店）\n收建43\n答无分款9人评价>\n肉69/人业1700-2400日+\n南京市福园街112号>\n热度笔记讨论热度金综）\n不知道起什么名字茶南这家奈淮玮牛肉，真的算是南湖顶流，从下午开始营业至晚上都半满了人！不仅有外助游客，也有农多我这样的南京本地城南人。\n更多思考中...\n任务已停止难吃到要专门发来给韩某看一一那必是真难吃。图呢，发来我瞧瞧。", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "human", "chars": 42, "text": "[本条消息真实时间 2026-09-09 22:52:21 星期三 (UTC+8)]", "name": null, "toolCallId": null, "toolCalls": []}, {"role": "ai", "chars": 253, "text": "<summary>看明白了——道友是照着网上的推荐帖去探店，结果踩了雷，把帖子发来证伪\"南湖顶流\"的名头。<\/s function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtC(n){return n>=1000?(n/1000).toFixed(1)+"k":n}
function pretty(o){try{return JSON.stringify(o,null,2)}catch(e){return String(o)}}
function hh(ts){return (ts||"").replace("T"," ").slice(5,19)}
function badge(role){return '<span class="badge role-'+role+'">'+role+'</span>'}

let CUR=null;
function pick(v){const p=v.split(':');CUR=DATA.runs[p[0]-1].calls[p[1]-1];document.getElementById('raw').textContent=JSON.stringify(CUR,null,2);render()}
function render(){const c=CUR;const only=document.getElementById('onlynew').checked;const auto=document.getElementById('autonew').checked;const start=only?Math.min(c.newIdxStart,c.msgs.length):0;
let h='<div class=muted>调用 #'+c.i+' · run 内第 '+c.i+' 次 · '+hh(c.ts)+' · '+c.provider+'/'+c.model+' · '+(c.msgsCount?'消息 '+c.msgsCount+' 条':'无消息列表输入')+'（新增 '+c.newCount+'） · 绑定工具 '+c.toolsBound+'</div>';
c.msgs.forEach(function(m,i){if(i<start)return;const isNew=i>=c.newIdxStart;
h+='<div class="bubble '+esc(m.role)+(isNew&&i>=c.newIdxStart?' new':'')+((isNew&&auto)||!isNew?' open':'')+'"><div class="bh" onclick="this.parentNode.classList.toggle(\'open\')">'+badge(m.role)+(m.name?'<span class=chip>'+esc(m.name)+'</span>':'')+(m.toolCallId?'<span class=chip>id:'+esc(String(m.toolCallId).slice(0,12))+'</span>':'')+'<span class=muted>'+fmtC(m.chars)+'字 · 第'+(i+1)+'条</span></div><div class="bb"><pre>'+esc(m.text)+'</pre>'+(m.toolCalls.length?'<h4>tool_calls</h4><pre>'+esc(pretty(m.toolCalls))+'</pre>':'')+'</div></div>'});
if(c.turnToolCalls.length){h+='<h3 class="sec">本轮工具调用（结果在下一次调用的消息里）</h3>'+c.turnToolCalls.map(function(tc){return '<div class="bubble tool open"><div class="bh">🔧 <b>'+esc(tc.name)+'</b><span class=muted>result '+(tc.result?tc.resultChars:0)+'字</span></div><div class="bb"><div><b>args</b></div><pre>'+esc(pretty(tc.args))+'</pre><div><b>result</b></div><pre>'+esc(tc.result==null?"（无结果记录）":tc.result)+'</pre></div></div>'}).join('')}
document.getElementById('left').innerHTML=h}
