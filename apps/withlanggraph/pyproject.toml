[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gacore"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain",
    "langgraph",
    "langgraph-checkpoint",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "python-dotenv",
    "httpx",
    "prompt_toolkit",
    "Pillow",
    "rapidocr-onnxruntime",
    "numpy",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
qq = [
    "qq-botpy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
