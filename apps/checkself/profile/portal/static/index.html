<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkSelf Portal</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0d0d11;
            --surface: #16161c;
            --surface-2: #1d1d25;
            --border: #2a2a33;
            --text: #e8e8ee;
            --muted: #9a9aa6;
            --faint: #6a6a76;
            --accent: #7c6cf0;
            --accent-weak: rgba(124, 108, 240, 0.14);
            --accent-line: rgba(124, 108, 240, 0.35);
            --success: #4ade80;
            --warn: #fbbf24;
            --danger: #f87171;
            --radius: 14px;
            --radius-sm: 10px;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
            --sans: -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Nav ===== */
        .nav {
            position: sticky; top: 0; z-index: 40;
            background: rgba(13,13,17,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            height: 60px;
            display: flex; gap: 4px; align-items: center;
            padding: 0 20px;
        }
        .nav .brand { font-size: 15px; font-weight: 600; margin-right: auto; letter-spacing: -0.01em; }
        .nav .brand .dot { color: var(--accent); }
        .nav button {
            background: transparent; border: none; color: var(--muted);
            cursor: pointer; font-size: 13px; padding: 8px 14px;
            border-radius: var(--radius-sm); transition: color .18s, background .18s;
            font-family: inherit;
        }
        .nav button:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav button.active { color: var(--text); background: var(--accent-weak); }

        .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }

        /* ===== Cards ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .card > h2 {
            font-size: 13px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 16px;
        }
        .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .card-head h2 { margin-bottom: 0; }
        .card-head .spacer { margin-left: auto; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
        .stat { text-align: left; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .stat .num { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

        /* ===== Buttons (shape lock: radius-sm, single accent) ===== */
        .btn {
            background: var(--accent); color: #fff; border: 1px solid transparent;
            padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer;
            font-size: 13px; font-family: inherit; font-weight: 500;
            transition: transform .12s, background .18s, opacity .18s;
        }
        .btn:hover { background: #6a5ae6; }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
        .btn-secondary:hover { background: #24242e; }
        .btn-danger { background: transparent; color: var(--danger); border-color: rgba(248,113,113,0.4); }
        .btn-danger:hover { background: rgba(248,113,113,0.1); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        /* ===== Inputs ===== */
        select, input[type="text"], input[type="number"] {
            background: var(--surface-2); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 7px 10px; font-size: 13px; font-family: inherit;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent-line); }
        label.field { display: inline-flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }

        /* ===== Badges / tags ===== */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500;
            border: 1px solid transparent;
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge-done { color: var(--success); background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.25); }
        .badge-failed { color: var(--danger); background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.25); }
        .badge-running { color: var(--warn); background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.25); }
        .badge-pending { color: var(--muted); background: rgba(255,255,255,0.05); border-color: var(--border); }
        .badge-cancelled { color: var(--faint); background: rgba(255,255,255,0.04); border-color: var(--border); }

        /* ===== Tables ===== */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--muted); font-size: 12px; }
        tbody tr { cursor: pointer; transition: background .15s; }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        td.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }

        /* ===== Progress ===== */
        .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 12px 0; }
        .progress-bar { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s cubic-bezier(0.16,1,0.3,1); }
        .progress-bar.indeterminate { width: 35% !important; animation: slide 1.2s ease-in-out infinite; }
        @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

        /* ===== Step list ===== */
        .steps { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
        .step { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13px; }
        .step .marker { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex: 0 0 auto; display: grid; place-items: center; font-size: 10px; color: var(--muted); }
        .step.done .marker { background: var(--success); border-color: var(--success); color: #0d0d11; }
        .step.done { color: var(--text); }
        .step.running .marker { border-color: var(--warn); color: var(--warn); }
        .step.running { color: var(--text); }
        .step.failed .marker { background: var(--danger); border-color: var(--danger); color: #0d0d11; }
        .step.failed { color: var(--danger); }
        .step.pending { color: var(--faint); }
        .step .time { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }
        .step .spin { margin-left: auto; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--warn); border-radius: 50%; animation: rot .7s linear infinite; }
        @keyframes rot { to { transform: rotate(360deg); } }

        /* ===== Log box ===== */
        .log-box {
            background: #08080b; color: #c8c8d4; border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px 14px;
            font-family: var(--mono); font-size: 12px; line-height: 1.6;
            max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
        }
        .log-line { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; gap: 8px; }
        .log-line .ts { color: var(--faint); flex: 0 0 auto; }
        .log-line .lv { flex: 0 0 auto; width: 46px; }
        .log-line .msg { flex: 1; }
        .lv-DEBUG { color: var(--faint); }
        .lv-INFO { color: #6ea8fe; }
        .lv-WARNING { color: var(--warn); }
        .lv-ERROR { color: var(--danger); }

        /* ===== Pagination ===== */
        .pagination { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
        .pagination .pageinfo { font-size: 12px; color: var(--muted); margin: 0 auto; }

        /* ===== Toasts ===== */
        .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--surface-2); border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 11px 16px; border-radius: var(--radius-sm); font-size: 13px;
            min-width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            animation: toastIn .25s cubic-bezier(0.16,1,0.3,1);
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warn { border-left-color: var(--warn); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ===== Modal ===== */
        .overlay {
            position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.6);
            display: grid; place-items: center; padding: 20px;
        }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); width: min(720px, 100%); max-height: 88vh;
            overflow-y: auto; padding: 22px; animation: modalIn .22s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
        .modal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .modal-head h3 { font-size: 15px; }
        .modal-head .spacer { margin-left: auto; }

        /* ===== Empty / loading ===== */
        .empty { text-align: center; padding: 40px 20px; color: var(--faint); font-size: 13px; }
        .empty .ico { font-size: 26px; opacity: .5; margin-bottom: 8px; }
        .skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, #24242e 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; height: 14px; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        .muted { color: var(--muted); }
        .faint { color: var(--faint); }
        .pill-note { font-size: 12px; color: var(--muted); }
        .err-text { color: var(--danger); font-size: 12px; margin-top: 6px; }
        pre { white-space: pre-wrap; word-break: break-word; background: #08080b; border: 1px solid var(--border); padding: 12px; border-radius: var(--radius-sm); font-family: var(--mono); font-size: 12px; overflow-x: auto; color: #c8c8d4; }
        details { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 8px; background: var(--surface-2); }
        details summary { cursor: pointer; font-weight: 500; font-size: 13px; }
        .dim-card { background: var(--surface-2); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: 12px; }
        .dim-card h3 { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
        .dim-card p { font-size: 13px; margin-bottom: 4px; }
        .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
        .kv .k { color: var(--muted); }

        [x-cloak] { display: none !important; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
            .progress-bar.indeterminate { animation: none; margin-left: 0; width: 100% !important; opacity: .4; }
        }
    </style>
</head>
<body x-data="portalApp()" x-init="init()" x-cloak>

    <!-- 导航栏（单行） -->
    <nav class="nav">
        <div class="brand">checkSelf<span class="dot">.</span>Portal</div>
        <button :class="{active: view==='dashboard'}" @click="view='dashboard'; loadDashboard()">总览</button>
        <button :class="{active: view==='data'}" @click="view='data'; loadData()">数据</button>
        <button :class="{active: view==='llm'}" @click="view='llm'; loadLLM()">LLM 调用</button>
        <button :class="{active: view==='profiles'}" @click="view='profiles'; loadProfiles()">画像产出</button>
    </nav>

    <!-- ============ 总览 ============ -->
    <div class="container" x-show="view==='dashboard'">
        <!-- 任务监控 / 启动 -->
        <div class="card">
            <div class="card-head">
                <h2>工作流</h2>
                <div class="spacer"></div>
                <button class="btn btn-sm btn-secondary" @click="loadDashboard()" :disabled="busy">刷新</button>
            </div>

            <!-- 运行中 / 刚结束：实时面板 -->
            <template x-if="dash.current_task">
                <div>
                    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                        <span class="badge" :class="'badge-'+dash.current_task.status" x-text="statusLabel(dash.current_task.status)"></span>
                        <span style="font-weight:600;" x-text="taskTypeLabel(dash.current_task.task_type)"></span>
                        <span class="faint mono" x-text="'#'+dash.current_task.id"></span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" :class="dash.current_task.status==='running' ? 'indeterminate' : ''"
                             :style="dash.current_task.status!=='running' ? 'width:'+taskProgress(dash.current_task)+'%' : ''"></div>
                    </div>
                    <p class="muted" x-text="dash.current_task.current_step || '--'"></p>
                    <div class="btn-row" style="margin-top:8px;">
                        <button class="btn btn-danger btn-sm" x-show="dash.current_task.status==='running'"
                                @click="cancelTask(dash.current_task.id)">取消任务</button>
                        <button class="btn btn-secondary btn-sm" @click="openMonitor(dash.current_task.id)">查看日志与步骤</button>
                    </div>
                </div>
            </template>

            <!-- 空闲：启动面板 -->
            <template x-if="!dash.current_task">
                <div>
                    <p class="muted" style="margin-bottom:14px;">当前没有运行中的任务。选择一项操作开始：</p>
                    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(220px,1fr));">
                        <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px;">
                            <div style="font-weight:600; margin-bottom:6px;">全链路刷新</div>
                            <div class="faint" style="font-size:12px; margin-bottom:10px;">入库 → 意图 → 画像 → 变化报告</div>
                            <div class="btn-row">
                                <label class="field">天数
                                    <input type="number" min="1" max="90" x-model.number="form.days" style="width:72px;">
                                </label>
                                <button class="btn btn-sm" @click="startTask('refresh_all', {days: form.days})">立即刷新</button>
                            </div>
                        </div>
                        <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px;">
                            <div style="font-weight:600; margin-bottom:6px;">数据入库</div>
                            <div class="faint" style="font-size:12px; margin-bottom:10px;">扫描来源并导入新数据</div>
                            <div class="btn-row">
                                <select x-model="form.source">
                                    <option value="">全部来源</option>
                                    <template x-for="s in knownSources" :key="s">
                                        <option :value="s" x-text="s"></option>
                                    </template>
                                </select>
                                <button class="btn btn-sm" @click="startTask('ingest', form.source ? {source: form.source} : {})">入库</button>
                            </div>
                        </div>
                        <template x-for="a in quickActions" :key="a.type">
                            <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px;">
                                <div style="font-weight:600; margin-bottom:6px;" x-text="a.title"></div>
                                <div class="faint" style="font-size:12px; margin-bottom:10px;" x-text="a.desc"></div>
                                <button class="btn btn-secondary btn-sm" @click="startTask(a.type, a.params ? a.params() : {})" x-text="a.btn"></button>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- 最近任务 -->
        <div class="card" x-show="dash.recent_tasks && dash.recent_tasks.length">
            <h2>最近任务</h2>
            <table>
                <thead><tr><th>ID</th><th>类型</th><th>状态</th><th>开始</th><th>结束</th><th></th></tr></thead>
                <tbody>
                    <template x-for="t in dash.recent_tasks" :key="t.id">
                        <tr @click="openMonitor(t.id)">
                            <td class="mono" x-text="'#'+t.id"></td>
                            <td x-text="taskTypeLabel(t.task_type)"></td>
                            <td><span class="badge" :class="'badge-'+t.status" x-text="statusLabel(t.status)"></span></td>
                            <td class="mono" x-text="shortTime(t.started_at)"></td>
                            <td class="mono" x-text="shortTime(t.finished_at)"></td>
                            <td class="faint" style="text-align:right;">查看 →</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- 数据概览 -->
        <div class="card">
            <h2>数据概览</h2>
            <template x-if="!dash.data_overview || !dash.data_overview.length">
                <div class="empty"><div class="ico">∅</div>暂无数据</div>
            </template>
            <div class="grid" x-show="dash.data_overview && dash.data_overview.length">
                <template x-for="d in dash.data_overview" :key="d.source">
                    <div class="stat">
                        <div class="num" x-text="d.count"></div>
                        <div class="label" x-text="d.source"></div>
                    </div>
                </template>
            </div>
        </div>

        <!-- LLM + 最新画像 -->
        <div class="two-col">
            <div class="card">
                <h2>LLM 调用</h2>
                <div class="grid">
                    <div class="stat"><div class="num" x-text="dash.llm_overview?.total_calls || 0"></div><div class="label">总调用</div></div>
                    <div class="stat"><div class="num" x-text="fmtNum(dash.llm_overview?.total_tokens || 0)"></div><div class="label">总 tokens</div></div>
                    <div class="stat"><div class="num" x-text="(((dash.llm_overview?.success_rate || 1)*100).toFixed(0))+'%'"></div><div class="label">成功率</div></div>
                </div>
            </div>
            <div class="card">
                <h2>最新画像</h2>
                <template x-if="dash.latest_profile">
                    <div>
                        <p style="font-size:13px; margin-bottom:8px;" x-text="dash.latest_profile.summary"></p>
                        <div class="kv">
                            <span class="k">方向对齐度</span><span x-text="dash.latest_profile.direction_alignment || '—'"></span>
                            <span class="k">日期</span><span x-text="dash.latest_profile.date || '—'"></span>
                        </div>
                    </div>
                </template>
                <template x-if="!dash.latest_profile"><div class="empty"><div class="ico">∅</div>暂无画像</div></template>
            </div>
        </div>

        <!-- 最新变化报告 -->
        <div class="card" x-show="dash.latest_changes">
            <h2>最新变化报告</h2>
            <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(110px,1fr));">
                <div class="stat"><div class="num" x-text="dash.latest_changes.new"></div><div class="label">新增</div></div>
                <div class="stat"><div class="num" x-text="dash.latest_changes.increased"></div><div class="label">上升</div></div>
                <div class="stat"><div class="num" x-text="dash.latest_changes.decreased"></div><div class="label">下降</div></div>
                <div class="stat"><div class="num" x-text="dash.latest_changes.disappeared"></div><div class="label">消失</div></div>
            </div>
        </div>
    </div>

    <!-- ============ 数据 ============ -->
    <div class="container" x-show="view==='data'">
        <div class="card">
            <div class="card-head">
                <h2>数据库浏览</h2>
                <div class="spacer"></div>
                <div class="btn-row">
                    <button class="btn btn-sm" :class="dataTab==='raw' ? '' : 'btn-secondary'" @click="dataTab='raw'; loadData()">原始数据</button>
                    <button class="btn btn-sm" :class="dataTab==='intents' ? '' : 'btn-secondary'" @click="dataTab='intents'; loadData()">意图</button>
                </div>
            </div>

            <div class="btn-row" style="margin-bottom:14px;">
                <select x-model="dataFilter.source" @change="dataPage=1; loadData()">
                    <option value="">全部来源</option>
                    <template x-for="s in dataSources" :key="s">
                        <option :value="s" x-text="s"></option>
                    </template>
                </select>
                <input type="text" x-model="dataFilter.q" @keydown.enter="dataPage=1; loadData()" placeholder="内容搜索…" style="flex:1; min-width:120px;">
                <button class="btn btn-secondary btn-sm" @click="dataPage=1; loadData()">搜索</button>
            </div>

            <template x-if="dataLoading"><div class="skeleton" style="height:200px;"></div></template>
            <template x-if="!dataLoading && !dataItems.length"><div class="empty"><div class="ico">∅</div>没有匹配的数据</div></template>

            <template x-if="!dataLoading && dataItems.length">
                <table>
                    <thead>
                        <template x-if="dataTab==='raw'"><tr><th>ID</th><th>来源</th><th>内容</th><th>时间</th></tr></template>
                        <template x-if="dataTab==='intents'"><tr><th>ID</th><th>分类</th><th>摘要</th><th>模型</th><th>时间</th></tr></template>
                    </thead>
                    <tbody>
                        <template x-for="item in dataItems" :key="item.id">
                            <tr @click="selectedData=item">
                                <template x-if="dataTab==='raw'">
                                    <td colspan="4" style="padding:0;">
                                        <div style="display:flex; gap:12px; padding:9px 12px;">
                                            <span class="mono" x-text="item.id" style="min-width:40px;"></span>
                                            <span x-text="item.source" style="min-width:60px;"></span>
                                            <span x-text="(item.content||'').substring(0,70)" style="flex:1; color:var(--text);"></span>
                                            <span class="mono faint" x-text="item.timestamp"></span>
                                        </div>
                                    </td>
                                </template>
                                <template x-if="dataTab==='intents'">
                                    <td colspan="5" style="padding:0;">
                                        <div style="display:flex; gap:12px; padding:9px 12px;">
                                            <span class="mono" x-text="item.id" style="min-width:40px;"></span>
                                            <span x-text="item.intent_category" style="min-width:80px;"></span>
                                            <span x-text="(item.intent_summary||'').substring(0,60)" style="flex:1; color:var(--text);"></span>
                                            <span class="mono faint" x-text="item.llm_model"></span>
                                            <span class="mono faint" x-text="item.extracted_at"></span>
                                        </div>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <div class="pagination" x-show="dataItems.length">
                <button class="btn btn-secondary btn-sm" @click="dataPage--; loadData()" x-show="dataPage>1">上一页</button>
                <span class="pageinfo" x-text="'第 '+dataPage+' 页 / 共 '+Math.max(1,Math.ceil(dataTotal/20))+' 页'"></span>
                <button class="btn btn-secondary btn-sm" @click="dataPage++; loadData()" x-show="dataPage*20 < dataTotal">下一页</button>
            </div>

            <template x-if="selectedData">
                <div class="overlay" @click="selectedData=null">
                <div class="modal" @click.stop>
                    <div class="modal-head">
                        <h3 x-text="'详情 #'+selectedData.id"></h3>
                        <div class="spacer"></div>
                        <button class="btn btn-secondary btn-sm" @click="selectedData=null">关闭</button>
                    </div>
                    <pre x-text="JSON.stringify(selectedData, null, 2)"></pre>
                </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ============ LLM ============ -->
    <div class="container" x-show="view==='llm'">
        <div class="card">
            <div class="card-head">
                <h2>LLM 调用</h2>
                <div class="spacer"></div>
                <div class="btn-row">
                    <select x-model="llmFilter.step" @change="llmPage=1; loadLLM()">
                        <option value="">全部步骤</option>
                        <option value="intent_extract">意图提取</option>
                        <option value="profile_trae">trae 画像</option>
                        <option value="profile_marvis">marvis 画像</option>
                        <option value="profile_global">综合画像</option>
                    </select>
                    <select x-model="llmFilter.success" @change="llmPage=1; loadLLM()">
                        <option value="">全部状态</option>
                        <option value="1">成功</option>
                        <option value="0">失败</option>
                    </select>
                </div>
            </div>

            <template x-if="llmLoading"><div class="skeleton" style="height:200px;"></div></template>
            <template x-if="!llmLoading && !llmItems.length"><div class="empty"><div class="ico">∅</div>暂无调用记录</div></template>

            <template x-if="!llmLoading && llmItems.length">
                <table>
                    <thead><tr><th>ID</th><th>步骤</th><th>模型</th><th>耗时</th><th>Tokens</th><th>状态</th></tr></thead>
                    <tbody>
                        <template x-for="c in llmItems" :key="c.id">
                            <tr @click="selectedLLM = (selectedLLM?.id === c.id) ? null : c">
                                <td class="mono" x-text="c.id"></td>
                                <td x-text="c.step"></td>
                                <td x-text="c.model"></td>
                                <td class="mono" x-text="c.elapsed_ms ? c.elapsed_ms+'ms' : '-'"></td>
                                <td class="mono" x-text="c.total_tokens || '-'"></td>
                                <td><span class="badge" :class="c.success ? 'badge-done' : 'badge-failed'" x-text="c.success ? '成功' : '失败'"></span></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <div class="pagination" x-show="llmItems.length">
                <button class="btn btn-secondary btn-sm" @click="llmPage--; loadLLM()" x-show="llmPage>1">上一页</button>
                <span class="pageinfo" x-text="'第 '+llmPage+' 页 / 共 '+Math.max(1,Math.ceil(llmTotal/20))+' 页'"></span>
                <button class="btn btn-secondary btn-sm" @click="llmPage++; loadLLM()" x-show="llmPage*20 < llmTotal">下一页</button>
            </div>

            <template x-if="selectedLLM">
                <div class="overlay" @click="selectedLLM=null">
                <div class="modal" @click.stop>
                    <div class="modal-head">
                        <h3 x-text="'调用详情 #'+selectedLLM.id"></h3>
                        <div class="spacer"></div>
                        <button class="btn btn-secondary btn-sm" @click="selectedLLM=null">关闭</button>
                    </div>
                    <details><summary>System Prompt</summary><pre x-text="selectedLLM.system_prompt || '(空)'"></pre></details>
                    <details><summary>User Prompt</summary><pre x-text="selectedLLM.user_prompt || '(空)'"></pre></details>
                    <p style="font-weight:500; margin:10px 0 4px;">Response</p>
                    <pre x-text="selectedLLM.response || '(空)'"></pre>
                    <template x-if="selectedLLM.error_message"><p class="err-text" x-text="'Error: '+selectedLLM.error_message"></p></template>
                </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ============ 画像 ============ -->
    <div class="container" x-show="view==='profiles'">
        <div class="card">
            <div class="card-head">
                <h2>画像产出</h2>
                <div class="spacer"></div>
                <div class="btn-row">
                    <button class="btn btn-sm" :class="profileViewMode==='structured' ? '' : 'btn-secondary'" @click="profileViewMode='structured'">结构化</button>
                    <button class="btn btn-sm" :class="profileViewMode==='json' ? '' : 'btn-secondary'" @click="profileViewMode='json'">原始 JSON</button>
                </div>
            </div>

            <template x-if="!profileItems.length"><div class="empty"><div class="ico">∅</div>暂无画像文件</div></template>

            <table x-show="profileItems.length">
                <thead><tr><th>文件名</th><th>类型</th><th>日期</th><th>大小</th></tr></thead>
                <tbody>
                    <template x-for="p in profileItems" :key="p.filename">
                        <tr @click="loadProfileDetail(p.filename)">
                            <td x-text="p.filename"></td>
                            <td x-text="profileTypeLabel(p.type)"></td>
                            <td class="mono" x-text="p.date || '—'"></td>
                            <td class="mono" x-text="(p.size/1024).toFixed(1)+'KB'"></td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <template x-if="selectedProfile">
                <div class="overlay" @click="selectedProfile=null">
                <div class="modal" @click.stop>
                    <div class="modal-head">
                        <h3 x-text="selectedProfile.filename"></h3>
                        <div class="spacer"></div>
                        <button class="btn btn-secondary btn-sm" @click="selectedProfile=null">关闭</button>
                    </div>
                    <template x-if="profileViewMode==='json'">
                        <pre x-text="JSON.stringify(selectedProfile.data, null, 2)"></pre>
                    </template>
                    <template x-if="profileViewMode==='structured'">
                        <div>
                            <template x-if="selectedProfile.data?.direction_truth">
                                <div class="dim-card">
                                    <h3>方向真实度</h3>
                                    <div class="kv">
                                        <span class="k">声称方向</span><span x-text="selectedProfile.data.direction_truth.claimed"></span>
                                        <span class="k">实际关注</span><span x-text="selectedProfile.data.direction_truth.actual_focus"></span>
                                        <span class="k">对齐度</span><span x-text="selectedProfile.data.direction_truth.alignment"></span>
                                    </div>
                                    <p style="margin-top:6px;" x-text="selectedProfile.data.direction_truth.description"></p>
                                </div>
                            </template>
                            <template x-if="selectedProfile.data?.knowledge_interest">
                                <div class="dim-card"><h3>知识兴趣光谱</h3><p x-text="selectedProfile.data.knowledge_interest.description"></p></div>
                            </template>
                            <template x-if="selectedProfile.data?.activity_pattern">
                                <div class="dim-card">
                                    <h3>作息精力模式</h3>
                                    <div class="kv">
                                        <span class="k">高效时段</span><span x-text="selectedProfile.data.activity_pattern.peak_hours"></span>
                                        <span class="k">日均</span><span x-text="selectedProfile.data.activity_pattern.daily_avg"></span>
                                    </div>
                                </div>
                            </template>
                            <template x-if="selectedProfile.data?.decision_style">
                                <div class="dim-card"><h3>决策行动模式</h3><p x-text="selectedProfile.data.decision_style.description"></p></div>
                            </template>
                            <template x-if="selectedProfile.data?.emotional_tendency">
                                <div class="dim-card"><h3>情绪审美倾向</h3><p x-text="selectedProfile.data.emotional_tendency.description"></p></div>
                            </template>
                            <template x-if="selectedProfile.data?.summary">
                                <div class="dim-card"><h3>总结</h3><p x-text="selectedProfile.data.summary"></p></div>
                            </template>
                            <template x-if="selectedProfile.data?.suggestions">
                                <div class="dim-card">
                                    <h3>建议</h3>
                                    <ul style="margin-left:18px;"><template x-for="s in selectedProfile.data.suggestions" :key="s"><li x-text="s"></li></template></ul>
                                </div>
                            </template>
                            <template x-if="selectedProfile.format==='markdown'">
                                <div x-html="renderMarkdown(selectedProfile.data)"></div>
                            </template>
                        </div>
                    </template>
                </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ============ 任务监控弹窗 ============ -->
    <template x-if="monitorOpen">
        <div class="overlay" @click="closeMonitor()">
            <div class="modal" @click.stop>
                <div class="modal-head">
                    <h3>
                        <span class="badge" :class="'badge-'+monitorTask.status" x-text="statusLabel(monitorTask.status)"></span>
                        <span style="margin-left:8px;" x-text="taskTypeLabel(monitorTask.task_type)"></span>
                        <span class="faint mono" x-text="'#'+monitorTask.id"></span>
                    </h3>
                    <div class="spacer"></div>
                    <button class="btn btn-danger btn-sm" x-show="monitorTask.status==='running'" @click="cancelTask(monitorTask.id)">取消</button>
                    <button class="btn btn-secondary btn-sm" @click="closeMonitor()">关闭</button>
                </div>

                <div class="kv" style="margin-bottom:14px;">
                    <span class="k">开始</span><span class="mono" x-text="monitorTask.started_at || '—'"></span>
                    <span class="k">结束</span><span class="mono" x-text="monitorTask.finished_at || '—'"></span>
                </div>
                <template x-if="monitorTask.error_message">
                    <p class="err-text" x-text="'错误: '+monitorTask.error_message"></p>
                </template>

                <h2 style="margin-bottom:8px;">步骤</h2>
                <div class="steps">
                    <template x-for="(s, i) in monitorSteps" :key="i">
                        <div class="step" :class="s.cls">
                            <span class="marker" x-text="s.icon"></span>
                            <span x-text="s.name"></span>
                            <template x-if="s.cls==='running'"><span class="spin"></span></template>
                            <span class="time" x-text="s.time || ''"></span>
                        </div>
                    </template>
                    <template x-if="!monitorSteps.length">
                        <div class="muted" style="padding:8px;" x-text="monitorTask.current_step || '等待开始…'"></div>
                    </template>
                </div>

                <h2 style="margin:18px 0 8px;">实时日志</h2>
                <div class="log-box" id="logbox">
                    <template x-for="log in monitorLogs" :key="log.seq">
                        <div class="log-line">
                            <span class="ts" x-text="log.timestamp?.split('T')[1] || ''"></span>
                            <span class="lv" :class="'lv-'+log.level" x-text="log.level"></span>
                            <span class="msg" x-text="log.message"></span>
                        </div>
                    </template>
                    <template x-if="!monitorLogs.length">
                        <div class="faint">暂无日志输出…</div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- Toasts -->
    <div class="toasts">
        <template x-for="t in toasts" :key="t.id">
            <div class="toast" :class="t.type" x-text="t.msg" @click="dismissToast(t.id)"></div>
        </template>
    </div>

    <script>
        function portalApp() {
            return {
                view: 'dashboard',
                busy: false,
                dash: {},
                toasts: [],
                _toastId: 0,

                form: { days: 7, source: '' },
                defaultSources: ['trae', 'marvis', 'bilibili', 'netease'],
                knownSources: ['trae', 'marvis', 'bilibili', 'netease'],
                quickActions: [
                    { type: 'extract_intents', title: '意图提取', desc: '从原始数据提炼意图', btn: '提取' },
                    { type: 'generate_profiles', title: '生成画像', desc: '基于近 7 天生成画像', btn: '生成', params: () => ({ days: 7 }) },
                ],

                // data
                dataTab: 'raw', dataItems: [], dataTotal: 0, dataPage: 1, dataLoading: false,
                dataFilter: { source: '', q: '' }, dataSources: [], selectedData: null,
                // llm
                llmItems: [], llmTotal: 0, llmPage: 1, llmLoading: false,
                llmFilter: { step: '', success: '' }, selectedLLM: null,
                // profiles
                profileItems: [], selectedProfile: null, profileViewMode: 'structured',

                // monitor
                monitorOpen: false, monitorTask: {}, monitorLogs: [], monitorSource: null, monitorTimer: null,

                async init() {
                    await this.loadDashboard();
                    // 后台轻量轮询：任务进行中时保持总览进度新鲜
                    setInterval(() => {
                        if (this.view === 'dashboard' && this.dash.current_task && this.dash.current_task.status === 'running') {
                            this.loadDashboard(true);
                        }
                    }, 4000);
                },

                // ---------- helpers ----------
                toast(msg, type = '') {
                    const id = ++this._toastId;
                    this.toasts.push({ id, msg, type });
                    setTimeout(() => this.dismissToast(id), 3600);
                },
                dismissToast(id) { this.toasts = this.toasts.filter(t => t.id !== id); },

                statusLabel(s) {
                    return ({ done: '已完成', failed: '失败', running: '运行中', pending: '排队中', cancelled: '已取消' })[s] || s;
                },
                taskTypeLabel(t) {
                    return ({ refresh_all: '全链路刷新', ingest: '数据入库', ingest_single: '单条入库',
                              extract_intents: '意图提取', generate_profiles: '生成画像' })[t] || t;
                },
                profileTypeLabel(t) {
                    return ({ global: '综合画像', trae: 'trae 画像', marvis: 'marvis 画像',
                              content_consumption: '内容消费', change_report: '变化报告', unknown: '未知' })[t] || t;
                },
                fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : ''+n; },
                shortTime(s) { return s ? s.replace('T', ' ').slice(0, 16) : '—'; },
                taskProgress(t) {
                    const steps = t.steps_json;
                    if (Array.isArray(steps) && steps.length) {
                        const done = steps.filter(s => s.status === 'done' || s.status === 'cancelled').length;
                        return Math.round(done / steps.length * 100);
                    }
                    const m = (t.current_step || '').match(/步骤(\d+)\/(\d+)/);
                    if (m) return Math.round(parseInt(m[1]) / parseInt(m[2]) * 100);
                    return t.status === 'done' ? 100 : 0;
                },
                renderMarkdown(txt) {
                    try { return marked.parse(txt); } catch (e) { return txt; }
                },

                // ---------- dashboard ----------
                async loadDashboard(silent = false) {
                    try {
                        const resp = await fetch('/api/dashboard');
                        this.dash = await resp.json();
                        if (!silent) {
                            this.dataSources = (this.dash.data_overview || []).map(d => d.source);
                            this.knownSources = [...new Set([...this.defaultSources, ...this.dataSources])];
                        }
                    } catch (e) {
                        if (!silent) this.toast('加载总览失败', 'error');
                    }
                },

                async startTask(taskType, params) {
                    this.busy = true;
                    try {
                        const resp = await fetch('/api/tasks', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ task_type: taskType, params }),
                        });
                        if (resp.ok) {
                            const data = await resp.json();
                            this.toast('任务已启动 #' + data.id, 'success');
                            this.form.source = '';
                            await this.loadDashboard();
                            this.openMonitor(data.id);
                        } else if (resp.status === 409) {
                            this.toast('已有任务在运行中', 'warn');
                        } else {
                            const err = await resp.json().catch(() => ({}));
                            this.toast('启动失败: ' + (err.detail || resp.statusText), 'error');
                        }
                    } catch (e) {
                        this.toast('网络错误', 'error');
                    } finally {
                        this.busy = false;
                    }
                },

                async cancelTask(taskId) {
                    try {
                        const resp = await fetch('/api/tasks/' + taskId, { method: 'DELETE' });
                        if (resp.ok) {
                            this.toast('已发送取消信号', 'warn');
                            this.loadDashboard(true);
                            this.refreshMonitorTask();
                        } else {
                            this.toast('无法取消', 'error');
                        }
                    } catch (e) { this.toast('网络错误', 'error'); }
                },

                // ---------- monitor ----------
                async openMonitor(taskId) {
                    this.monitorOpen = true;
                    this.monitorLogs = [];
                    await this.refreshMonitorTask(taskId);
                    this.startLogStream(taskId);
                    // 实时轮询任务状态，驱动步骤列表/进度刷新（SSE 只推日志，不推步骤）
                    this.monitorTimer = setInterval(() => {
                        this.refreshMonitorTask(taskId);
                        if (this.monitorTask && this.monitorTask.status !== 'running') {
                            clearInterval(this.monitorTimer);
                            this.monitorTimer = null;
                        }
                    }, 2000);
                },
                async refreshMonitorTask(taskId) {
                    const id = taskId || this.monitorTask?.id;
                    if (!id) return;
                    try {
                        const resp = await fetch('/api/tasks/' + id);
                        this.monitorTask = await resp.json();
                    } catch (e) { /* ignore */ }
                },
                startLogStream(taskId) {
                    this.stopLogStream();
                    const es = new EventSource('/api/tasks/' + taskId + '/logs');
                    this.monitorSource = es;
                    es.onmessage = (ev) => {
                        let payload;
                        try { payload = JSON.parse(ev.data); } catch (e) { return; }
                        if (payload.event === 'done') {
                            this.refreshMonitorTask(taskId);
                            this.loadDashboard(true);
                            setTimeout(() => this.stopLogStream(), 800);
                            return;
                        }
                        this.monitorLogs.push(payload);
                        this.$nextTick(() => {
                            const box = document.getElementById('logbox');
                            if (box) box.scrollTop = box.scrollHeight;
                        });
                    };
                    es.onerror = () => { /* EventSource 会在任务结束后自动关闭 */ };
                },
                stopLogStream() {
                    if (this.monitorSource) { this.monitorSource.close(); this.monitorSource = null; }
                    if (this.monitorTimer) { clearInterval(this.monitorTimer); this.monitorTimer = null; }
                },
                closeMonitor() {
                    this.monitorOpen = false;
                    this.stopLogStream();
                    this.loadDashboard(true);
                },
                get monitorSteps() {
                    const t = this.monitorTask;
                    if (!t) return [];
                    const steps = t.steps_json;
                    if (Array.isArray(steps) && steps.length) {
                        return steps.map(s => {
                            const cls = s.status;
                            const icon = cls === 'done' ? '✓' : cls === 'failed' ? '✕' : cls === 'cancelled' ? '–' : (cls === 'running' ? '' : '');
                            const time = (s.started_at && s.finished_at)
                                ? (s.started_at.slice(11,19) + '→' + s.finished_at.slice(11,19))
                                : (s.started_at ? s.started_at.slice(11,19) : '');
                            return { name: s.name, cls, icon, time };
                        });
                    }
                    // 运行中但还没有 steps_json：根据 current_step 推断
                    const m = (t.current_step || '').match(/步骤(\d+)\/(\d+):\s*(.+)/);
                    const total = m ? parseInt(m[2]) : 0;
                    const cur = m ? parseInt(m[1]) : 0;
                    const out = [];
                    for (let i = 1; i <= Math.max(total, 1); i++) {
                        if (i < cur) out.push({ name: '步骤 ' + i, cls: 'done', icon: '✓', time: '' });
                        else if (i === cur) out.push({ name: m[3] || ('步骤 ' + i), cls: 'running', icon: '', time: '' });
                        else out.push({ name: '步骤 ' + i, cls: 'pending', icon: '', time: '' });
                    }
                    return out;
                },

                // ---------- data ----------
                async loadData() {
                    this.dataLoading = true;
                    const params = new URLSearchParams({ page: this.dataPage, page_size: 20 });
                    if (this.dataFilter.source) params.set('source', this.dataFilter.source);
                    if (this.dataFilter.q) params.set('q', this.dataFilter.q);
                    const endpoint = this.dataTab === 'raw' ? '/api/data/raw' : '/api/data/intents';
                    try {
                        const resp = await fetch(endpoint + '?' + params);
                        const data = await resp.json();
                        this.dataItems = data.items || [];
                        this.dataTotal = data.total || 0;
                    } catch (e) {
                        this.toast('加载数据失败', 'error');
                    } finally {
                        this.dataLoading = false;
                    }
                },

                // ---------- llm ----------
                async loadLLM() {
                    this.llmLoading = true;
                    const params = new URLSearchParams({ page: this.llmPage, page_size: 20 });
                    if (this.llmFilter.step) params.set('step', this.llmFilter.step);
                    if (this.llmFilter.success !== '') params.set('success', this.llmFilter.success);
                    try {
                        const resp = await fetch('/api/llm/calls?' + params);
                        const data = await resp.json();
                        this.llmItems = data.items || [];
                        this.llmTotal = data.total || 0;
                    } catch (e) {
                        this.toast('加载调用失败', 'error');
                    } finally {
                        this.llmLoading = false;
                    }
                },

                // ---------- profiles ----------
                async loadProfiles() {
                    try {
                        const resp = await fetch('/api/profiles');
                        const data = await resp.json();
                        this.profileItems = data.items || [];
                    } catch (e) { this.toast('加载画像失败', 'error'); }
                },
                async loadProfileDetail(filename) {
                    try {
                        const resp = await fetch('/api/profiles/' + encodeURIComponent(filename));
                        this.selectedProfile = await resp.json();
                    } catch (e) { this.toast('读取画像失败', 'error'); }
                },
            };
        }
    </script>
</body>
</html>
